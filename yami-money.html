<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Yami Money</title>
  <style>
    :root{--orange:#ff671d;--navy:#17394d;--ink:#1b3040;--muted:#70818b;--line:#dce5e9;--soft:#edf3f6;--green:#1d7a50}*{box-sizing:border-box}body{margin:0;background:#162833;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select{font:inherit}.app{max-width:414px;min-height:100vh;margin:auto;background:linear-gradient(#112b3bc7,#112b3bc7),url('assets/images/main/bg_splash.png') center/cover fixed;box-shadow:0 0 30px #0008}.head{padding:18px 20px 76px;background:linear-gradient(135deg,#173f56ed,#0c2839ed);color:#fff}.top{display:flex;align-items:center}.back{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:50%;background:#ffffff1f;color:#fff;font-size:29px;cursor:pointer}.brand{margin-left:12px;font-size:22px;font-weight:850}.head h1{margin:29px 0 4px;font-size:28px;letter-spacing:-.5px}.head p{margin:0;color:#d5e3e9;font-size:13px;line-height:1.4}.body{padding:0 16px 38px}.wallet{display:flex;align-items:center;justify-content:space-between;margin-top:-50px;padding:17px 18px;border-radius:20px;background:linear-gradient(145deg,#fff,#f7fafb);box-shadow:0 9px 24px #00131e55}.wallet small{display:block;margin-bottom:4px;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.55px}.wallet b{font-size:22px}.wallet-mark{display:grid;place-items:center;width:45px;height:45px;border-radius:14px;background:var(--orange);color:#fff;font-size:23px;font-style:italic;font-weight:900}.card{margin-top:17px;padding:18px;border-radius:20px;background:#fffffff7;box-shadow:0 9px 24px #00131e40}.card label{display:block;margin:14px 0 6px;color:#657680;font-size:10px;font-weight:850;letter-spacing:.55px}.card label:first-child{margin-top:0}.field{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}.field:focus{border-color:var(--navy);box-shadow:0 0 0 3px #17394d16}.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.amount{padding:11px 5px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#2c414d;font-size:12px;font-weight:850;cursor:pointer}.amount.selected{border-color:var(--orange);background:#fff1ea;color:#d94d09}.summary{margin-top:15px;padding:13px;border-radius:13px;background:var(--soft);font-size:12px}.summary div{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.summary b{text-align:right}.primary{width:100%;margin-top:15px;padding:14px;border:0;border-radius:12px;background:var(--orange);color:#fff;font-weight:850;cursor:pointer;box-shadow:0 7px 16px #ff671d30}.primary:active{transform:scale(.985)}.hint{margin:15px 5px 0;color:#e8f1f5;font-size:11px;line-height:1.45;text-align:center}.modal{position:fixed;z-index:5;inset:0;display:none;align-items:end;justify-content:center;background:#071923a8}.modal.open{display:flex}.sheet{width:min(100%,414px);padding:13px 20px calc(25px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0;background:#fff}.handle{width:36px;height:4px;margin:0 auto 18px;border-radius:4px;background:#d7e0e4}.sheet h2{margin:0;font-size:22px}.sheet>p{margin:7px 0;color:var(--muted);font-size:13px;line-height:1.4}.confirm-summary{margin-top:14px;padding:13px;border-radius:13px;background:#f3f6f7;font-size:13px}.confirm-summary div{display:flex;justify-content:space-between;gap:13px;margin:8px 0}.confirm-summary b{text-align:right}.cancel{width:100%;margin-top:8px;padding:11px;border:0;background:none;color:#687983;font-weight:800;cursor:pointer}.success{display:none;margin-top:17px;padding:20px;border-radius:20px;background:#f8fffb;box-shadow:0 8px 22px #00131e3d}.success-icon{display:grid;place-items:center;width:48px;height:48px;margin-bottom:12px;border-radius:50%;background:#e3f6eb;color:var(--green);font-size:24px}.success h2{margin:0 0 5px;font-size:21px}.success p{margin:0;color:#59706d;font-size:13px;line-height:1.45}.receipt-code{margin-top:13px;padding-top:12px;border-top:1px solid #dbe9e0;color:var(--green);font-size:11px;font-weight:850;letter-spacing:.5px}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><div class="top"><button class="back" type="button" aria-label="Back to Yami">‹</button><div class="brand">Yami</div></div><h1 id="title">Send Money</h1><p id="intro"></p></header>
    <main class="body">
      <section class="wallet"><div><small>YAMI MAIN BALANCE</small><b id="wallet">R10,057.00</b></div><span class="wallet-mark">Y</span></section>
      <section class="card" id="formCard"><label id="inputLabel"></label><input class="field" id="reference"><label id="amountLabel">CHOOSE AMOUNT</label><div class="amounts" id="amounts"></div><div class="summary"><div><span>Payment source</span><b>Yami main balance</b></div><div><span>Available</span><b id="available">R10,057.00</b></div></div><button class="primary" id="continueButton" type="button">Continue</button></section>
      <section class="success" id="success"><div class="success-icon">✓</div><h2 id="successTitle">Completed successfully</h2><p id="successText"></p><div class="receipt-code" id="receiptCode"></div><button class="primary" id="doneButton" type="button">Done</button></section>
      <p class="hint">This is a safe interactive demo. No real money is moved.</p>
    </main>
  </main>
  <div class="modal" id="modal"><section class="sheet"><div class="handle"></div><h2 id="confirmTitle">Confirm transaction</h2><p>Review the details before continuing from your Yami balance.</p><div class="confirm-summary" id="confirmSummary"></div><button class="primary" id="confirmButton" type="button">Confirm</button><button class="cancel" id="cancelButton" type="button">Cancel</button></section></div>
  <script src="/yami-wallet.js?v=1"></script><script>
    const flow = new URLSearchParams(location.search).get('flow') || 'send';
    const flows = {
      send:{title:'Send Money',intro:'Pay someone securely from your Yami balance.',label:'RECIPIENT MOBILE NUMBER',value:'072 555 0198',choices:[50,100,250],verb:'Money sent',detail:'sent to'},
      request:{title:'Request Money',intro:'Send a clear payment request to someone you trust.',label:'REQUEST FROM',value:'071 440 8821',choices:[50,150,300],verb:'Request sent',detail:'requested from',noCharge:true},
      withdraw:{title:'Withdraw',intro:'Create a secure cash voucher for collection.',label:'COLLECTION METHOD',value:'Yami ATM voucher',choices:[100,250,500],verb:'Withdrawal voucher ready',detail:'prepared for'},
      deposit:{title:'Deposit',intro:'Add money to Yami from a linked payment source.',label:'DEPOSIT FROM',value:'Linked bank card •••• 4821',choices:[100,300,500],verb:'Deposit completed',detail:'added from',adds:true}
    };
    const config=flows[flow]||flows.send;let selected=0,wallet=YamiWallet.get();
    const title=document.getElementById('title'),intro=document.getElementById('intro'),inputLabel=document.getElementById('inputLabel'),reference=document.getElementById('reference'),amounts=document.getElementById('amounts'),walletEl=document.getElementById('wallet'),available=document.getElementById('available'),modal=document.getElementById('modal'),formCard=document.getElementById('formCard'),success=document.getElementById('success');
    const money=value=>YamiWallet.format(value);
    const back=()=>{if(parent!==window)parent.postMessage({type:'yami:closeMiniApp'},'*');else location.assign('/tabs/home/home/');};
    document.querySelector('.back').onclick=back;
    title.textContent=config.title;document.title=`${config.title} | Yami`;intro.textContent=config.intro;inputLabel.textContent=config.label;reference.value=config.value;walletEl.textContent=money(wallet);available.textContent=money(wallet);
    function renderAmounts(){amounts.innerHTML=config.choices.map((amount,index)=>`<button class="amount ${selected===index?'selected':''}" type="button" data-index="${index}">R${amount}</button>`).join('');amounts.querySelectorAll('.amount').forEach(button=>button.onclick=()=>{selected=Number(button.dataset.index);renderAmounts();});}
    document.getElementById('continueButton').onclick=()=>{if(!reference.value.trim())reference.value=config.value;const amount=config.choices[selected];document.getElementById('confirmTitle').textContent=`Confirm ${config.title.toLowerCase()}`;document.getElementById('confirmSummary').innerHTML=`<div><span>${config.label}</span><b>${reference.value}</b></div><div><span>Amount</span><b>${money(amount)}</b></div><div><span>${config.noCharge?'Request delivery':'Payment source'}</span><b>${config.noCharge?'Instant notification':'Yami main balance'}</b></div>`;document.getElementById('confirmButton').textContent=config.noCharge?'Send request':`Confirm · ${money(amount)}`;modal.classList.add('open');};
    document.getElementById('cancelButton').onclick=()=>modal.classList.remove('open');
    modal.onclick=event=>{if(event.target===modal)modal.classList.remove('open');};
    document.getElementById('confirmButton').onclick=()=>{const amount=config.choices[selected];let result={ok:true,balance:YamiWallet.get(),transaction:{id:`YAMI-${flow.toUpperCase()}-${String(Date.now()).slice(-6)}`}};if(!config.noCharge)result=config.adds?YamiWallet.credit(amount,{label:config.title,category:'Payments',detail:reference.value}):YamiWallet.debit(amount,{label:config.title,category:'Payments',detail:reference.value});if(!result.ok){document.getElementById('confirmButton').textContent='Insufficient Yami balance';return;}wallet=result.balance;walletEl.textContent=money(wallet);available.textContent=money(wallet);modal.classList.remove('open');formCard.style.display='none';success.style.display='block';document.getElementById('successTitle').textContent=`${config.verb} ✓`;document.getElementById('successText').textContent=`${money(amount)} ${config.detail} ${reference.value}.`;document.getElementById('receiptCode').textContent=result.transaction.id;};
    document.getElementById('doneButton').onclick=back;
    renderAmounts();
  </script>
</body>
</html>
