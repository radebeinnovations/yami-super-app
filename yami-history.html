<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Yami activity</title>
  <style>
    :root{--ink:#183243;--muted:#71838d;--line:#e3ebee;--orange:#ff671d;--navy:#17394d;--soft:#f3f8f8;--success:#16825b}*{box-sizing:border-box}body{margin:0;background:#17272f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}button{font:inherit}.app{max-width:414px;min-height:100vh;margin:auto;padding-bottom:30px;background:linear-gradient(#10243392,#10243392),url('assets/images/main/bg_splash.png') center/cover fixed;box-shadow:0 0 30px #0008}.head{padding:18px 20px 84px;color:#fff;background:linear-gradient(135deg,#17394ded,#0f2939ec)}.top{display:flex;align-items:center}.brand{margin-left:12px;font-size:22px;font-weight:850}.head h1{margin:28px 0 4px;font-size:27px}.head p{margin:0;color:#d7e7eb;font-size:13px}.body{padding:0 16px 34px}.insight{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:-56px}.insight-card{padding:15px;border-radius:18px;background:#fffffff5;box-shadow:0 8px 20px #001c2d2b}.insight-card small{display:block;color:var(--muted);font-size:11px;font-weight:750}.insight-card b{display:block;margin-top:6px;font-size:19px}.insight-card span{display:block;margin-top:3px;color:var(--success);font-size:11px;font-weight:750}.section{margin-top:20px;padding:18px 14px;border-radius:21px;background:#fffffff7;box-shadow:0 8px 21px #001c2d22}.section h2{margin:0 3px 12px;font-size:20px}.filters{display:flex;gap:8px;overflow:auto;padding:0 3px 12px}.filter{flex:0 0 auto;padding:8px 13px;border:1px solid var(--line);border-radius:18px;background:#fff;color:#61747d;font-size:12px;font-weight:800}.filter.active{border-color:var(--orange);background:var(--orange);color:#fff}.day{margin:15px 4px 7px;color:#788991;font-size:11px;font-weight:850;letter-spacing:.5px}.activity{width:100%;padding:13px 4px;border:0;border-top:1px solid var(--line);background:transparent;display:flex;align-items:center;gap:11px;color:var(--ink);text-align:left}.activity-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--soft);color:var(--orange);font-size:18px}.activity-text{min-width:0;flex:1}.activity-text b{display:block;font-size:13px}.activity-text small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.activity-value{font-size:13px;font-weight:850;text-align:right}.activity-value small{display:block;margin-top:3px;color:var(--success);font-size:10px;font-weight:750}.sheet-wrap{position:fixed;z-index:5;inset:0;display:none;align-items:end;background:#10293585}.sheet-wrap.open{display:flex}.sheet{width:100%;padding:13px 20px calc(28px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0;background:#fff}.handle{width:36px;height:4px;margin:0 auto 18px;border-radius:3px;background:#d8e0e3}.sheet h2{margin:0;font-size:22px}.sheet p{margin:7px 0 15px;color:var(--muted);font-size:13px;line-height:1.4}.receipt{padding:13px;border-radius:14px;background:#f4f8f9}.receipt div{display:flex;justify-content:space-between;gap:10px;margin:8px 0;font-size:13px}.done{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:850}.toast{position:fixed;z-index:8;left:50%;bottom:30px;transform:translate(-50%,20px);opacity:0;padding:11px 15px;border-radius:20px;background:#17303e;color:#fff;font-size:13px;white-space:nowrap;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}
  </style>
</head>
<body>
  <main class="app"><header class="head"><div class="top"><button class="back" aria-label="Back">‹</button><div class="brand">Yami</div></div><h1>Activity</h1><p>Every payment, booking and reward in one place.</p></header><main class="body"><section class="insight"><article class="insight-card"><small>THIS MONTH</small><b>R2 481.50</b><span>↓ R318 vs last month</span></article><article class="insight-card"><small>YAMI REWARDS</small><b>640 points</b><span>Next reward in 110 pts</span></article></section><section class="section"><h2>Recent activity</h2><div class="filters"><button class="filter active" data-filter="All">All</button><button class="filter" data-filter="Payments">Payments</button><button class="filter" data-filter="Travel">Travel</button><button class="filter" data-filter="Services">Services</button></div><div id="activityList"></div></section></main></main><section class="sheet-wrap" id="sheet"><div class="sheet"><div class="handle"></div><h2 id="sheetTitle"></h2><p id="sheetCopy"></p><div class="receipt" id="receipt"></div><button class="done" id="done">Done</button></div></section><div class="toast" id="toast"></div><script src="/yami-shell.js?v=1"></script><script>
const entries=[{type:'Payments',icon:'◫',title:'MTN data bundle',detail:'1 GB · Mobile purchase',amount:'− R29.00',time:'Today · 10:42',status:'Completed'},{type:'Travel',icon:'⌁',title:'PRASA train ticket',detail:'Park Station to Pretoria',amount:'− R42.00',time:'Yesterday · 16:18',status:'Booked'},{type:'Services',icon:'ϟ',title:'City Power electricity',detail:'Meter •••• 1042',amount:'− R250.00',time:'28 Aug · 09:16',status:'Token issued'},{type:'Payments',icon:'↗',title:'Sent to S. Dlamini',detail:'Yami transfer',amount:'− R180.00',time:'27 Aug · 18:34',status:'Completed'},{type:'Travel',icon:'✈',title:'Yami Flights booking',detail:'Johannesburg to Cape Town',amount:'− R1 149.00',time:'26 Aug · 12:20',status:'Confirmed'}];let active='All';const list=document.getElementById('activityList');const toastEl=document.getElementById('toast');const showToast=t=>{toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(window.historyToast);window.historyToast=setTimeout(()=>toastEl.classList.remove('show'),1800)};function render(){const visible=entries.filter(item=>active==='All'||item.type===active);list.innerHTML=visible.map((item,index)=>`${index===0?'<div class="day">TODAY</div>':index===1?'<div class="day">EARLIER THIS WEEK</div>':''}<button class="activity" data-entry="${entries.indexOf(item)}"><span class="activity-icon">${item.icon}</span><span class="activity-text"><b>${item.title}</b><small>${item.detail} · ${item.time}</small></span><span class="activity-value">${item.amount}<small>${item.status}</small></span></button>`).join('')||'<div class="day">No activity in this category yet.</div>';document.querySelectorAll('.filter').forEach(button=>button.classList.toggle('active',button.dataset.filter===active));}document.querySelector('.filters').onclick=e=>{const button=e.target.closest('.filter');if(!button)return;active=button.dataset.filter;render()};list.onclick=e=>{const button=e.target.closest('[data-entry]');if(!button)return;const item=entries[Number(button.dataset.entry)];sheetTitle.textContent=item.title;sheetCopy.textContent=`${item.status} · ${item.time}`;receipt.innerHTML=`<div><span>Category</span><b>${item.type}</b></div><div><span>Reference</span><b>YMI-${String(401826+Number(button.dataset.entry)*73)}</b></div><div><span>Amount</span><b>${item.amount}</b></div><div><span>Paid from</span><b>Yami main balance</b></div>`;sheet.classList.add('open')};done.onclick=()=>{sheet.classList.remove('open');showToast('Receipt closed')};render();
</script></body></html>
