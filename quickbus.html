<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>QuickBus | Yami</title><style>
:root{--navy:#102e4a;--orange:#f36a21;--pale:#fff1e9;--ink:#1d2831;--muted:#73818b;--line:#e7eaec}*{box-sizing:border-box}body{margin:0;background:#17252f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;color:var(--ink)}button,input,select{font:inherit}.app{min-height:100vh;max-width:414px;margin:auto;background:#f7f8f9;box-shadow:0 0 30px #0008}.head{padding:18px 20px 35px;background:linear-gradient(135deg,#102e4a,#184d70);color:#fff}.top{display:flex;align-items:center}.back{width:40px;height:40px;border:0;border-radius:50%;background:#ffffff1d;color:#fff;font-size:26px}.logo{margin-left:12px;font-size:22px;font-weight:800}.logo span{color:#ff914f}.tag{margin:28px 0 0;font-size:24px;font-weight:800}.tag small{display:block;margin-top:6px;color:#d6e7f1;font-size:13px;font-weight:400}.body{padding:0 16px 90px}.search{margin-top:-18px;padding:17px;background:#fff;border-radius:18px;box-shadow:0 7px 18px #00192a18}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;margin-bottom:6px;color:#667682;font-size:11px;font-weight:800}.field select,.field input{width:100%;padding:12px 9px;border:1px solid #dce4e8;border-radius:10px;background:#fafcfc;font-size:13px}.primary{width:100%;margin-top:15px;padding:14px;border:0;border-radius:11px;background:var(--orange);color:#fff;font-weight:800}.title{margin:23px 1px 11px;font-size:18px;font-weight:800}.trip{margin-bottom:12px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:17px}.trip-top{display:flex;justify-content:space-between}.times{font-size:20px;font-weight:800}.sub{margin-top:5px;color:var(--muted);font-size:12px}.price{color:var(--orange);font-weight:800;font-size:19px}.price small{display:block;color:var(--muted);font-size:10px;font-weight:500}.trip-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}.seats{font-size:12px;color:#1e7b4d;font-weight:700}.outline{padding:9px 12px;border:1px solid #f6b38e;border-radius:9px;background:#fff;color:#d95915;font-weight:800}.steps{display:flex;justify-content:space-between;margin:20px 7px}.step{color:#92a0a8;font-size:11px;text-align:center}.step b{display:grid;place-items:center;width:28px;height:28px;margin:auto auto 5px;border-radius:50%;background:#dce4e8;color:#65737b}.step.active{color:var(--orange)}.step.active b{background:var(--orange);color:#fff}.modal{position:fixed;inset:0;z-index:4;display:none;align-items:end;background:#00192a85}.modal.open{display:flex}.sheet{width:100%;padding:13px 20px calc(28px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:#fff}.handle{width:34px;height:4px;margin:0 auto 18px;border-radius:4px;background:#d7dde0}.sheet h2{margin:0;font-size:21px}.seat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:18px 0}.seat{height:45px;border:1px solid #d4dde1;border-radius:9px;background:#fff;color:#385263;font-weight:800}.seat.selected{border-color:var(--orange);background:var(--pale);color:var(--orange)}.seat.taken{border-color:#e7e9eb;background:#f1f2f3;color:#b0b8bd;text-decoration:line-through}.summary{margin:12px 0;padding:12px;border-radius:11px;background:#f5f8f9;font-size:13px}.summary div{display:flex;justify-content:space-between;margin:6px}.ticket{margin-top:18px;padding:18px;border-radius:17px;background:linear-gradient(135deg,#123855,#1b587d);color:#fff}.ticket small{color:#cfe8f4}.ticket h2{margin:7px 0;font-size:21px}.hidden{display:none}.toast{position:fixed;left:50%;bottom:82px;z-index:9;transform:translate(-50%,20px);opacity:0;padding:11px 15px;border-radius:20px;background:#172a34;color:#fff;font-size:13px;white-space:nowrap;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}
</style></head><body><main class="app"><header class="head"><div class="top"><a class="back" href="/tabs/home/home/">‹</a><div class="logo">Quick<span>Bus</span></div></div><div class="tag">Book your next trip<small>Simple, reliable journeys across South Africa.</small></div></header><main class="body"><section class="search"><div class="fields"><div class="field"><label>FROM</label><select id="from"><option>Johannesburg</option><option>Pretoria</option><option>Durban</option></select></div><div class="field"><label>TO</label><select id="to"><option>Cape Town</option><option>Durban</option><option>Pretoria</option></select></div><div class="field"><label>DEPARTURE</label><input id="date" type="date"></div><div class="field"><label>PASSENGERS</label><select id="passengers"><option>1 Adult</option><option>2 Adults</option><option>3 Adults</option></select></div></div><button class="primary" id="search">Find buses</button></section><div class="steps"><span class="step active"><b>1</b>Trip</span><span class="step"><b>2</b>Seat</span><span class="step"><b>3</b>Booked</span></div><h2 class="title" id="resultsTitle">Popular departures</h2><div id="results"></div><section class="ticket hidden" id="ticket"><small>QUICKBUS E-TICKET</small><h2 id="ticketRoute"></h2><p id="ticketInfo"></p><div style="margin-top:18px;padding-top:13px;border-top:1px dashed #fff8"><b id="ticketRef"></b><span style="float:right">Confirmed ✓</span></div></section></main></main><div class="modal" id="modal"><section class="sheet"><div class="handle"></div><h2>Select a seat</h2><p style="color:#73818b;font-size:13px">Pick your preferred available window or aisle seat.</p><div class="seat-grid" id="seats"></div><div class="summary" id="summary"></div><button class="primary" id="book">Confirm bus booking</button><button class="outline" id="close" style="width:100%;margin-top:10px">Cancel</button></section></div><div class="toast" id="toast"></div><script>
document.querySelector('.back').onclick=(event)=>{event.preventDefault();if(window.parent!==window){window.parent.postMessage({type:'yami:closeMiniApp'},'*')}else{window.location.assign('/tabs/home/home/')}};const state={trip:null,seat:null};const today=new Date().toISOString().slice(0,10);date.value=today;date.min=today;const toast=(x)=>{toastEl.textContent=x;toastEl.classList.add('show');clearTimeout(window.qb);window.qb=setTimeout(()=>toastEl.classList.remove('show'),2100)};const toastEl=document.getElementById('toast');
function draw(){const f=from.value,t=to.value;resultsTitle.textContent=`Buses from ${f} to ${t}`;const base=Math.abs(f.length-t.length)*7+189;results.innerHTML=['06:30','10:15','19:40'].map((time,i)=>`<article class="trip"><div class="trip-top"><div><div class="times">${time} → ${String((Number(time.slice(0,2))+6)%24).padStart(2,'0')}:${i?'35':'15'}</div><div class="sub">${f} · ${t} · Express coach</div></div><div class="price">R${base+i*45}<small>per person</small></div></div><div class="trip-bottom"><span class="seats">● ${11-i*3} seats left</span><button class="outline" onclick="choose(${i},${base+i*45},'${time}')">Choose</button></div></article>`).join('')};
function choose(i,price,time){state.trip={from:from.value,to:to.value,price,time};state.seat=null;seats.innerHTML=['1A','1B','2A','2B','3A','3B','4A','4B','5A','5B','6A','6B'].map((s,i)=>`<button class="seat ${[2,7].includes(i)?'taken':''}" ${[2,7].includes(i)?'disabled':''} onclick="selectSeat('${s}',this)">${s}</button>`).join('');summary.innerHTML=`<div><span>${state.trip.from} → ${state.trip.to}</span><b>R${state.trip.price}</b></div><div><span>Departure</span><b>${state.trip.time} · ${date.value}</b></div><div><span>Seat</span><b id="seatValue">Choose a seat</b></div>`;modal.classList.add('open')};
function selectSeat(s,el){document.querySelectorAll('.seat').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');state.seat=s;seatValue.textContent=s};
search.onclick=draw;close.onclick=()=>modal.classList.remove('open');book.onclick=()=>{if(!state.seat){toast('Please select a seat first');return}modal.classList.remove('open');ticket.classList.remove('hidden');ticketRoute.textContent=`${state.trip.from} → ${state.trip.to}`;ticketInfo.textContent=`${date.value} · ${state.trip.time} · Seat ${state.seat} · ${passengers.value}`;ticketRef.textContent=`QB-${Math.random().toString(36).slice(2,8).toUpperCase()}`;document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('active',i===2));toast('Your bus ticket is confirmed')};draw();
</script></body></html>
