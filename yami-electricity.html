<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Yami Electricity</title>
  <style>
    :root{--ink:#1b3040;--brand:#f36a21;--muted:#70828c}*{box-sizing:border-box}body{margin:0;background:#17272f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}.app{max-width:414px;min-height:100vh;margin:auto;background:linear-gradient(#102433a8,#102433a8),url('assets/images/main/bg_splash.png') center/cover fixed;box-shadow:0 0 30px #0008}.head{padding:18px 20px 72px;background:linear-gradient(135deg,#f66b22ed,#c94a0de8);color:#fff}.top{display:flex;align-items:center}.back{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:#ffffff25;color:#fff;font-size:27px}.brand{margin-left:11px;font-size:22px;font-weight:850}.head h1{margin:28px 0 4px;font-size:27px}.head p{margin:0;color:#fff0e8;font-size:13px}.body{padding:0 16px 35px}.card{margin-top:-48px;padding:18px;border-radius:20px;background:#fffffff5;box-shadow:0 8px 22px #00131e55}.card label{display:block;margin:13px 0 6px;color:#61737d;font-size:11px;font-weight:800}.card label:first-child{margin-top:0}.card input,.card select{width:100%;padding:13px;border:1px solid #d9e5e1;border-radius:11px;background:#fff;color:#21333e}.packages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.package{padding:10px 4px;border:1px solid #d6e0e4;border-radius:10px;background:#fff;color:#2c414c;font-size:11px;font-weight:800}.package.selected{border-color:var(--brand);background:#fff0e8;color:#cf4c10}.primary{width:100%;margin-top:15px;padding:14px;border:0;border-radius:11px;background:var(--brand);color:#fff;font-weight:800}.summary{display:none;margin-top:18px;padding:16px;border-radius:16px;background:#f8fafb;box-shadow:0 8px 22px #00131e33}.summary h2{margin:0 0 4px;font-size:20px}.summary p{margin:0 0 13px;color:var(--muted);font-size:12px}.summary div{display:flex;justify-content:space-between;gap:10px;margin:9px 0;font-size:13px}.summary b{font-weight:800}.notice{display:none;margin-top:17px;padding:16px;border-radius:15px;background:#e6f7ed;color:#187347}.notice b{display:block;margin-bottom:5px;font-size:17px}.secondary{width:100%;margin-top:9px;padding:11px;border:1px solid #f0a87e;border-radius:11px;background:#fff;color:#cf4c10;font-weight:800}
  </style>
</head>
<body>
  <main class="app"><header class="head"><div class="top"><button class="back" aria-label="Back">‹</button><div class="brand">Yami</div></div><h1>Electricity</h1><p>Buy prepaid electricity safely from your Yami balance.</p></header><main class="body"><section class="card" id="formCard"><label>MUNICIPALITY</label><select id="municipality"><option value="">Select municipality</option><option>City Power Johannesburg</option><option>City of Cape Town</option><option>eThekwini Electricity</option><option>Nelson Mandela Bay</option></select><label>METER NUMBER</label><input id="meter" inputmode="numeric" placeholder="Enter 11-digit meter number"><label>AMOUNT</label><input id="amount" inputmode="decimal" placeholder="Enter an amount"><div class="packages"><button class="package selected" data-amount="100">R100</button><button class="package" data-amount="250">R250</button><button class="package" data-amount="500">R500</button></div><button class="primary" id="continue">Continue</button></section><section class="summary" id="summary"><h2>Confirm electricity purchase</h2><p>Your prepaid token will be generated immediately after confirmation.</p><div><span>Municipality</span><b id="confirmMunicipality"></b></div><div><span>Meter number</span><b id="confirmMeter"></b></div><div><span>Purchase amount</span><b id="confirmAmount"></b></div><div><span>Payment source</span><b>Yami main balance</b></div><button class="primary" id="confirm">Confirm and pay</button><button class="secondary" id="edit">Edit details</button></section><section class="notice" id="notice"><b>Electricity token ready ✓</b><span id="tokenText"></span></section></main></main>
  <script src="/yami-wallet.js?v=1"></script><script>
    const municipality=document.getElementById('municipality'),meter=document.getElementById('meter'),amount=document.getElementById('amount'),formCard=document.getElementById('formCard'),summary=document.getElementById('summary'),notice=document.getElementById('notice');let selectedAmount=100;municipality.selectedIndex=1;meter.value='01234567890';
    const back=()=>{if(parent!==window)parent.postMessage({type:'yami:closeMiniApp'},'*');else location.assign('/tabs/home/home/');};document.querySelector('.back').onclick=back;
    document.querySelectorAll('.package').forEach(button=>button.onclick=()=>{selectedAmount=Number(button.dataset.amount);amount.value=selectedAmount;document.querySelectorAll('.package').forEach(item=>item.classList.toggle('selected',item===button));});amount.value=selectedAmount;
    document.getElementById('continue').onclick=()=>{if(!municipality.value){municipality.focus();return;}if(!/^\d{11}$/.test(meter.value.replace(/\s/g,''))){meter.focus();return;}const purchase=Number(amount.value);if(!Number.isFinite(purchase)||purchase<10){amount.focus();return;}selectedAmount=purchase;document.getElementById('confirmMunicipality').textContent=municipality.value;document.getElementById('confirmMeter').textContent=meter.value;document.getElementById('confirmAmount').textContent=`R${purchase.toFixed(2)}`;formCard.style.display='none';summary.style.display='block';};
    document.getElementById('edit').onclick=()=>{summary.style.display='none';formCard.style.display='block';};document.getElementById('confirm').onclick=()=>{const result=YamiWallet.debit(selectedAmount,{label:'Prepaid electricity',category:'Services',detail:`${municipality.value} · ${meter.value}`});if(!result.ok){document.getElementById('confirm').textContent='Insufficient Yami balance';return;}summary.style.display='none';notice.style.display='block';const token=Array.from({length:4},()=>String(Math.floor(1000+Math.random()*9000))).join(' ');document.getElementById('tokenText').textContent=`Token: ${token}. ${YamiWallet.format(selectedAmount)} has been charged from your Yami main balance. Balance: ${result.formatted}.`;};
  </script>
</body>
</html>
