<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Yami Services</title>
    <style>
      :root{--orange:#ff671d;--navy:#17394d;--ink:#18394d;--muted:#6d8491;--line:#d9e7ed;--soft:#f3f8fa;--blue:#eaf3f6}*{box-sizing:border-box}body{min-width:320px;margin:0;background:#f4f8fa;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}.app{width:min(100%,620px);min-height:100vh;margin:auto;padding:24px 18px calc(30px + env(safe-area-inset-bottom));background:#fff}.head{padding:0 2px 18px}.eyebrow{display:block;margin-bottom:6px;color:var(--orange);font-size:10px;font-weight:900;letter-spacing:1.4px}.head h1{margin:0;color:var(--navy);font-size:29px;letter-spacing:-1px}.head p{max-width:390px;margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.service-card{display:flex;min-height:129px;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:15px;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:0 6px 16px #17394d0a;color:var(--ink);text-align:left;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.service-card:hover{transform:translateY(-2px);border-color:#b9d7e5;box-shadow:0 11px 20px #17394d16}.service-card:focus-visible,.all-services:focus-visible,.pay:focus-visible,.amount:focus-visible{outline:3px solid #ff671d55;outline-offset:3px}.service-icon{display:grid;width:43px;height:43px;place-items:center;border-radius:14px;background:var(--blue);color:var(--navy)}.service-icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.service-card b{font-size:15px;line-height:1.08}.service-card small{display:block;margin-top:4px;color:var(--muted);font-size:10px;line-height:1.32}.flow[hidden],.hub[hidden]{display:none}.flow-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.all-services{padding:8px 11px;border:1px solid #d6e5eb;border-radius:11px;background:#fff;color:var(--navy);font-size:11px;font-weight:850;cursor:pointer}.flow-head span{color:var(--muted);font-size:11px;font-weight:800}.service-hero{position:relative;overflow:hidden;padding:19px;border-radius:22px;background:linear-gradient(135deg,#17394d,#2b6f8d);color:#fff;box-shadow:0 13px 26px #17394d1e}.service-hero:after{position:absolute;right:-43px;bottom:-75px;width:180px;height:180px;border:1px solid #ffffff36;border-radius:50%;content:""}.service-hero>*{position:relative;z-index:1}.service-hero .service-icon{background:#ffffff1c;color:#fff}.service-hero h2{margin:14px 0 4px;font-size:25px;letter-spacing:-.7px}.service-hero p{margin:0;color:#dcecf3;font-size:12px;line-height:1.4}.flow-card{margin-top:17px;padding:17px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 18px #17394d0a}.field-label{display:block;margin-bottom:7px;color:#607684;font-size:10px;font-weight:900;letter-spacing:.8px}.reference{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;outline:0;background:#fbfdfe;color:var(--ink);font-size:15px}.reference:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff671d1a}.amount-title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}.amount-title b{font-size:17px}.amount-title small{color:var(--muted);font-size:10px;font-weight:800}.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.amount{min-height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--navy);font-size:13px;font-weight:850;cursor:pointer}.amount.active{border-color:var(--orange);background:#fff0e8;color:#ce5114}.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:14px;border-radius:15px;background:var(--soft)}.summary span{min-width:0}.summary small,.summary b{display:block}.summary small{color:var(--muted);font-size:10px;font-weight:800}.summary b{overflow:hidden;margin-top:4px;color:var(--navy);font-size:14px;text-overflow:ellipsis;white-space:nowrap}.summary strong{color:var(--orange);font-size:20px}.pay{width:100%;margin-top:12px;padding:15px;border:0;border-radius:13px;background:var(--orange);box-shadow:0 8px 16px #ff671d35;color:#fff;font-size:15px;font-weight:900;cursor:pointer}.receipt{display:none;margin-top:15px;padding:15px;border:1px solid #bfe4d5;border-radius:16px;background:#f0fbf6;color:#257052;font-size:12px;line-height:1.45}.receipt.show{display:block}.receipt b{display:block;margin-bottom:3px;font-size:14px}@media(max-width:360px){.app{padding-right:13px;padding-left:13px}.service-card{min-height:118px;padding:13px}.service-card b{font-size:14px}.amount{font-size:12px}}
    </style>
  </head>
  <body>
    <main class="app">
      <header class="head"><span class="eyebrow">YAMI SERVICES</span><h1 id="page-title">Make today easier.</h1><p id="page-copy">One place for the useful things that keep your day moving.</p></header>

      <section class="hub" id="service-hub" aria-label="Yami service directory"></section>

      <section class="flow" id="service-flow" hidden>
        <div class="flow-head"><button class="all-services" id="show-hub" type="button">All services</button><span>Demo transaction</span></div>
        <section class="service-hero"><div class="service-icon" id="flow-icon" aria-hidden="true"></div><h2 id="flow-title"></h2><p id="flow-copy"></p></section>
        <section class="flow-card"><label class="field-label" id="reference-label" for="reference"></label><input class="reference" id="reference" autocomplete="off"><div class="amount-title"><b id="amount-heading">Choose an amount</b><small>Secure demo checkout</small></div><div class="amounts" id="amounts"></div><section class="summary"><span><small id="summary-label"></small><b id="summary-reference"></b></span><strong id="summary-amount"></strong></section><button class="pay" id="pay" type="button"></button><section class="receipt" id="receipt" role="status"><b id="receipt-title"></b><span id="receipt-copy"></span></section></section>
      </section>
    </main>
    <script src="/yami-wallet.js?v=1"></script>
    <script>
      (() => {
        const icons={bills:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',vouchers:'<svg viewBox="0 0 24 24"><path d="M4 8h16v10H4z"/><path d="M12 8v10M4 12h3M17 12h3"/><path d="M7 8V5h10v3"/></svg>',school:'<svg viewBox="0 0 24 24"><path d="m3 9 9-5 9 5-9 5Z"/><path d="M7 12v4c3 2 7 2 10 0v-4M21 9v6"/></svg>',health:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>',parcel:'<svg viewBox="0 0 24 24"><path d="m4 7 8-4 8 4v10l-8 4-8-4Z"/><path d="m4 7 8 4 8-4M12 11v10"/></svg>',parking:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>',home:'<svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9H15v-6H9v6H3Z"/><path d="M17 7v-3h2v5"/></svg>',insurance:'<svg viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6Z"/><path d="m8.5 12 2.2 2.2 4.8-4.8"/></svg>'};
        const services={
          bills:{name:'Bills & utilities',short:'Pay a bill',intro:'Municipal, TV and household bill payments in one place.',label:'ACCOUNT OR BILL REFERENCE',placeholder:'e.g. City Power · 012345678',value:'City Power · 012345678',amounts:[100,250,500],icon:icons.bills},
          vouchers:{name:'Digital vouchers',short:'Send a voucher',intro:'Send a useful shopping voucher in a few taps.',label:'RECIPIENT MOBILE NUMBER',placeholder:'e.g. 071 234 5678',value:'071 234 5678',amounts:[50,100,250],icon:icons.vouchers},
          school:{name:'School payments',short:'Pay school fees',intro:'Keep education payments simple and organised.',label:'LEARNER OR SCHOOL REFERENCE',placeholder:'e.g. YAMI-LEARNER-2048',value:'YAMI-LEARNER-2048',amounts:[250,750,1500],icon:icons.school},
          health:{name:'Health & pharmacy',short:'Health payments',intro:'Pay for pharmacy collections and health essentials.',label:'PHARMACY OR MEMBER REFERENCE',placeholder:'e.g. Clinic Care · 312442',value:'Clinic Care · 312442',amounts:[150,300,600],icon:icons.health},
          parcel:{name:'Parcel & delivery',short:'Track a parcel',intro:'Pay for delivery and keep a parcel on its way.',label:'TRACKING OR DELIVERY REFERENCE',placeholder:'e.g. YMI-DEL-8421',value:'YMI-DEL-8421',amounts:[49,89,129],icon:icons.parcel},
          parking:{name:'Parking & tolls',short:'Pay for parking',intro:'Top up a parking or road-travel balance quickly.',label:'VEHICLE REGISTRATION',placeholder:'e.g. ABC 123 GP',value:'ABC 123 GP',amounts:[20,50,100],icon:icons.parking},
          home:{name:'Home services',short:'Book home help',intro:'Arrange trusted help for the things that need fixing.',label:'SERVICE ADDRESS OR REQUEST',placeholder:'e.g. 10 Main Road · Plumbing',value:'10 Main Road · Plumbing',amounts:[250,450,750],icon:icons.home},
          insurance:{name:'Insurance',short:'Get cover',intro:'Make a cover payment or start a quick quote.',label:'POLICY OR ID REFERENCE',placeholder:'e.g. YAMI-COVER-8812',value:'YAMI-COVER-8812',amounts:[129,249,399],icon:icons.insurance}
        };
        const hub=document.getElementById('service-hub'),flow=document.getElementById('service-flow'),title=document.getElementById('page-title'),copy=document.getElementById('page-copy'),reference=document.getElementById('reference'),amounts=document.getElementById('amounts'),receipt=document.getElementById('receipt');
        let activeService=null,activeAmount=0;
        const money=value=>`R${Number(value).toLocaleString('en-ZA')}.00`;
        const renderHub=()=>{hub.innerHTML=Object.entries(services).map(([key,service])=>`<button class="service-card" type="button" data-service="${key}"><span class="service-icon" aria-hidden="true">${service.icon}</span><span><b>${service.name}</b><small>${service.short}</small></span></button>`).join('');hub.querySelectorAll('[data-service]').forEach(button=>button.addEventListener('click',()=>openService(button.dataset.service)));};
        const renderAmounts=()=>{const service=services[activeService];amounts.innerHTML=service.amounts.map((amount,index)=>`<button class="amount ${index===activeAmount?'active':''}" type="button" data-amount="${index}">${money(amount)}</button>`).join('');amounts.querySelectorAll('[data-amount]').forEach(button=>button.addEventListener('click',()=>{activeAmount=Number(button.dataset.amount);renderAmounts();refreshSummary();}));};
        const refreshSummary=()=>{const service=services[activeService],amount=service.amounts[activeAmount],value=reference.value.trim()||service.placeholder;document.getElementById('summary-label').textContent=service.name;document.getElementById('summary-reference').textContent=value;document.getElementById('summary-amount').textContent=money(amount);document.getElementById('pay').textContent=`Pay ${money(amount)} from Yami`};
        const openService=key=>{activeService=key;activeAmount=0;const service=services[key];hub.hidden=true;flow.hidden=false;title.textContent=service.name;copy.textContent='Complete a quick demo transaction from your Yami balance.';document.getElementById('flow-icon').innerHTML=service.icon;document.getElementById('flow-title').textContent=service.name;document.getElementById('flow-copy').textContent=service.intro;document.getElementById('reference-label').textContent=service.label;reference.placeholder=service.placeholder;reference.value=service.value;document.getElementById('amount-heading').textContent=`Choose ${service.name.toLowerCase()} amount`;receipt.classList.remove('show');renderAmounts();refreshSummary();window.scrollTo({top:0,behavior:'smooth'});};
        document.getElementById('show-hub').addEventListener('click',()=>{flow.hidden=true;hub.hidden=false;title.textContent='Make today easier.';copy.textContent='One place for the useful things that keep your day moving.';window.scrollTo({top:0,behavior:'smooth'});});
        reference.addEventListener('input',refreshSummary);
        document.getElementById('pay').addEventListener('click',()=>{const service=services[activeService],amount=service.amounts[activeAmount],value=reference.value.trim();if(!value){reference.focus();return}const result=window.YamiWallet?.debit?.(amount,{label:service.name,category:'Services',detail:value});if(result&&!result.ok){document.getElementById('receipt-title').textContent='Insufficient Yami balance';document.getElementById('receipt-copy').textContent='Choose a smaller amount or top up your Yami wallet, then try again.';receipt.classList.add('show');return}document.getElementById('receipt-title').textContent='Demo payment completed';document.getElementById('receipt-copy').textContent=`${money(amount)} was recorded for ${service.name.toLowerCase()}. This is a local demo transaction.`;receipt.classList.add('show');});
        renderHub();const requested=new URLSearchParams(location.search).get('service');if(requested&&services[requested])openService(requested);
      })();
    </script>
  </body>
</html>
