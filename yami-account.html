<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Yami account</title>
  <style>
    :root{--ink:#183243;--muted:#71838d;--line:#e3ebee;--orange:#ff671d;--navy:#17394d;--soft:#f3f8f8;--success:#16825b}*{box-sizing:border-box}body{margin:0;background:#17272f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}button{font:inherit}.app{max-width:414px;min-height:100vh;margin:auto;padding-bottom:31px;background:linear-gradient(#10243392,#10243392),url('assets/images/main/bg_splash.png') center/cover fixed;box-shadow:0 0 30px #0008}.head{padding:18px 20px 87px;color:#fff;background:linear-gradient(135deg,#17394ded,#0f2939ec)}.top{display:flex;align-items:center}.brand{margin-left:12px;font-size:22px;font-weight:850}.profile{margin-top:25px;display:flex;align-items:center;gap:12px}.avatar{display:grid;place-items:center;width:55px;height:55px;border:2px solid #ffffff6e;border-radius:19px;background:#fff;color:var(--orange);font-size:21px;font-weight:900}.profile b{display:block;font-size:20px}.profile small{display:block;margin-top:3px;color:#d9e8ec;font-size:12px}.body{padding:0 16px 34px}.wallet{display:flex;align-items:center;justify-content:space-between;margin-top:-48px;padding:17px;border-radius:20px;background:#fffffff7;box-shadow:0 8px 21px #001c2d2b}.wallet small{display:block;color:var(--muted);font-size:11px;font-weight:800}.wallet b{display:block;margin-top:5px;font-size:23px}.wallet button{padding:9px 12px;border:1px solid #ffc6a8;border-radius:10px;background:#fff;color:#d75110;font-size:12px;font-weight:850}.card{margin-top:17px;padding:16px 13px;border-radius:20px;background:#fffffff7;box-shadow:0 8px 21px #001c2d22}.card h2{margin:0 4px 9px;font-size:19px}.card p{margin:0 4px 8px;color:var(--muted);font-size:12px}.setting{width:100%;padding:13px 4px;border:0;border-top:1px solid var(--line);background:transparent;display:flex;align-items:center;gap:11px;color:var(--ink);text-align:left}.setting-icon{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:var(--soft);color:var(--orange);font-size:17px}.setting-copy{flex:1}.setting-copy b{display:block;font-size:13px}.setting-copy small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.chev{color:#7c8d94;font-size:22px}.switch{width:42px;height:25px;border:0;border-radius:20px;background:#cfdade;position:relative}.switch:after{content:"";position:absolute;top:4px;left:4px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.18s}.switch.on{background:var(--success)}.switch.on:after{left:21px}.sheet-wrap{position:fixed;z-index:5;inset:0;display:none;align-items:end;background:#10293585}.sheet-wrap.open{display:flex}.sheet{width:100%;padding:13px 20px calc(28px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0;background:#fff}.handle{width:36px;height:4px;margin:0 auto 18px;border-radius:3px;background:#d8e0e3}.sheet h2{margin:0;font-size:22px}.sheet p{margin:7px 0 15px;color:var(--muted);font-size:13px;line-height:1.4}.detail{padding:13px;border-radius:14px;background:#f4f8f9}.detail div{display:flex;justify-content:space-between;gap:10px;margin:8px 0;font-size:13px}.done{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:850}.toast{position:fixed;z-index:8;left:50%;bottom:30px;transform:translate(-50%,20px);opacity:0;padding:11px 15px;border-radius:20px;background:#17303e;color:#fff;font-size:13px;white-space:nowrap;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}
  </style>
</head>
<body>
  <main class="app"><header class="head"><div class="top"><button class="back" aria-label="Back">‹</button><div class="brand">Yami</div></div><section class="profile"><span class="avatar">TM</span><span><b>Thando Mokoena</b><small>Verified Yami account</small></span></section></header><main class="body"><section class="wallet"><span><small>AVAILABLE YAMI BALANCE</small><b>R10 057.00</b></span><button id="addMoney">Add money</button></section><section class="card"><h2>Profile & security</h2><button class="setting" data-detail="Personal details"><span class="setting-icon">◉</span><span class="setting-copy"><b>Personal details</b><small>Phone number, email and address</small></span><span class="chev">›</span></button><button class="setting" data-detail="Security"><span class="setting-icon">⌁</span><span class="setting-copy"><b>Security centre</b><small>PIN, password and trusted devices</small></span><span class="chev">›</span></button><button class="setting" data-detail="Linked accounts"><span class="setting-icon">◫</span><span class="setting-copy"><b>Linked accounts</b><small>Cards and payment methods</small></span><span class="chev">›</span></button></section><section class="card"><h2>Preferences</h2><button class="setting" id="notifications"><span class="setting-icon">♧</span><span class="setting-copy"><b>Transaction alerts</b><small>Get important account updates</small></span><span class="switch on" id="notificationSwitch"></span></button><button class="setting" data-detail="Help centre"><span class="setting-icon">?</span><span class="setting-copy"><b>Help centre</b><small>Support, FAQs and contact options</small></span><span class="chev">›</span></button></section></main></main><section class="sheet-wrap" id="sheet"><div class="sheet"><div class="handle"></div><h2 id="sheetTitle"></h2><p id="sheetCopy"></p><div class="detail" id="detail"></div><button class="done" id="done">Done</button></div></section><div class="toast" id="toast"></div><script src="/yami-shell.js?v=1"></script><script>
const details={'Personal details':[['Mobile','060 553 4886'],['Email','thando@yami.demo'],['Status','Verified']],Security:[['Yami PIN','Enabled'],['Biometric access','Ready'],['Trusted devices','1 device']], 'Linked accounts':[['Yami main balance','Primary'],['Bank card','•••• 4821'],['Auto top-up','Off']], 'Help centre':[['In-app support','Available'],['Emergency help','Available 24/7'],['Case reference','Create a request']]};const toastEl=document.getElementById('toast');const showToast=t=>{toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(window.accountToast);window.accountToast=setTimeout(()=>toastEl.classList.remove('show'),1800)};document.querySelectorAll('[data-detail]').forEach(button=>button.onclick=()=>{const title=button.dataset.detail;sheetTitle.textContent=title;sheetCopy.textContent=title==='Help centre'?'Choose the option that works best for you.':'Your Yami account details are protected and ready to manage.';detail.innerHTML=details[title].map(([label,value])=>`<div><span>${label}</span><b>${value}</b></div>`).join('');sheet.classList.add('open')});notifications.onclick=()=>{notificationSwitch.classList.toggle('on');showToast(`Transaction alerts ${notificationSwitch.classList.contains('on')?'enabled':'paused'}`)};addMoney.onclick=()=>{sheetTitle.textContent='Add money';sheetCopy.textContent='This demo keeps your Yami main balance protected.';detail.innerHTML='<div><span>Payment source</span><b>Linked bank card</b></div><div><span>Suggested top-up</span><b>R500.00</b></div>';sheet.classList.add('open')};done.onclick=()=>sheet.classList.remove('open');
</script></body></html>
