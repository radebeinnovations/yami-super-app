<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b4c83">
    <title>Choose a bus service | Yami</title>
    <style>
      :root { --ink:#17394d; --muted:#647989; --line:#d7e8ef; --blue:#075a9c; --teal:#057174; --lime:#c5ed32; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:#f7fbfc; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      main { max-width:690px; margin:0 auto; padding:30px 20px 42px; }
      .eyebrow { margin:0 0 8px; color:#fe681e; font-size:12px; font-weight:850; letter-spacing:.14em; }
      h1 { margin:0; font-size:clamp(30px,7vw,40px); letter-spacing:-1.7px; line-height:1.05; }
      .intro { max-width:530px; margin:12px 0 28px; color:var(--muted); font-size:16px; line-height:1.55; }
      .choices { display:grid; gap:16px; }
      .choice { position:relative; min-height:210px; overflow:hidden; border:0; border-radius:26px; padding:23px; color:#fff; text-align:left; background:#0a5b95; box-shadow:0 14px 30px #0d355b23; cursor:pointer; isolation:isolate; transition:transform .18s ease,box-shadow .18s ease; }
      .choice:hover,.choice:focus-visible { transform:translateY(-3px); box-shadow:0 20px 38px #0d355b35; outline:3px solid #ffa46a; outline-offset:3px; }
      .choice::before { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(4,22,47,.86),rgba(4,22,47,.3) 66%,rgba(4,22,47,.1)); }
      .choice::after { content:""; position:absolute; inset:0; z-index:-2; background:center/cover no-repeat; transform:scale(1.03); }
      .choice--metro::after { background-image:url("assets/bus_bg_user.png"); background-position:center 55%; }
      .choice--ekurhuleni::after { background-image:url("assets/ekurhuleni-bus-hero.png"); }
      .pill { display:inline-flex; border:1px solid #ffffff60; border-radius:99px; padding:6px 10px; background:#ffffff1c; font-size:11px; font-weight:800; letter-spacing:.1em; }
      .choice h2 { max-width:330px; margin:23px 0 7px; font-size:30px; letter-spacing:-1.1px; line-height:1; }
      .choice p { max-width:340px; margin:0; color:#f3f8ff; font-size:15px; line-height:1.35; }
      .go { position:absolute; right:20px; bottom:20px; display:inline-grid; place-items:center; width:42px; height:42px; border-radius:50%; background:#fff; color:#16415b; font-size:23px; font-weight:800; }
      .choice--ekurhuleni .pill { border-color:#c5ed3288; color:#edff9a; }
      .choice--ekurhuleni .go { background:var(--lime); color:#124246; }
      .note { margin:23px 4px 0; color:#79909d; font-size:13px; line-height:1.5; }
      @media (max-width:390px) { main { padding-inline:16px; } .choice { min-height:194px; } .choice h2 { font-size:27px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">BUS TRAVEL</p>
      <h1>Choose your bus service</h1>
      <p class="intro">Pick the network you travel with. Your Yami wallet stays in one place, and you can switch services whenever you need to.</p>
      <section class="choices" aria-label="Available bus services">
        <button class="choice choice--metro" type="button" data-open="metrobus.html" data-name="MetroBus">
          <span class="pill">CITY TRAVEL</span>
          <h2>MetroBus</h2>
          <p>Plan city routes, manage your MetroCard and top up for your next trip.</p>
          <span class="go" aria-hidden="true">→</span>
        </button>
        <button class="choice choice--ekurhuleni" type="button" data-open="ekurhuleni-bus.html" data-name="Ekurhuleni Bus">
          <span class="pill">KTVR BUS SERVICE</span>
          <h2>Ekurhuleni Bus</h2>
          <p>Routes, timetables and a tap-ready wallet for getting around Ekurhuleni.</p>
          <span class="go" aria-hidden="true">→</span>
        </button>
      </section>
      <p class="note">More transport services can be added here as Yami grows.</p>
    </main>
    <script>
      document.querySelectorAll('[data-open]').forEach((button) => {
        button.addEventListener('click', () => parent.postMessage({
          type: 'yami:openMiniApp', destination: button.dataset.open, name: button.dataset.name
        }, window.location.origin));
      });
    </script>
  </body>
</html>
