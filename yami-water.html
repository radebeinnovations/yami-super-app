<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Water & municipal bills | Yami</title>
  <style>
    :root{--ink:#173243;--blue:#087da4;--deep:#124b68;--muted:#70828c;--line:#d9e5e9;--green:#19764c}*{box-sizing:border-box}body{margin:0;background:#162833;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select{font:inherit}.app{max-width:414px;min-height:100vh;margin:auto;background:linear-gradient(#102d3ba8,#102d3ba8),url('assets/images/main/bg_splash.png') center/cover fixed;box-shadow:0 0 30px #0008}.head{padding:18px 20px 78px;background:linear-gradient(135deg,#087da4ec,#123f5aec);color:#fff}.top{display:flex;align-items:center}.back{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:50%;background:#ffffff22;color:#fff;font-size:29px}.brand{margin-left:12px;font-size:22px;font-weight:850}.head h1{margin:28px 0 4px;font-size:27px}.head p{margin:0;color:#d6f1f8;font-size:13px;line-height:1.4}.body{padding:0 16px 36px}.wallet{display:flex;align-items:center;justify-content:space-between;margin-top:-51px;padding:16px 17px;border-radius:19px;background:#fff;box-shadow:0 9px 23px #00192345}.wallet small{display:block;color:var(--muted);font-size:10px;font-weight:850}.wallet b{display:block;margin-top:4px;font-size:21px}.drop{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:#e4f6fb;color:var(--blue)}.drop svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8}.card{margin-top:17px;padding:18px;border-radius:20px;background:#fffffff8;box-shadow:0 9px 23px #0019233b}.card label{display:block;margin:13px 0 6px;color:#61737d;font-size:10px;font-weight:850;letter-spacing:.5px}.card label:first-child{margin-top:0}.card input,.card select{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.amount{padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#2c414c;font-size:12px;font-weight:850}.amount.selected{border-color:var(--blue);background:#e9f8fc;color:#066d91}.primary{width:100%;margin-top:15px;padding:14px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:850}.summary{display:none;margin-top:17px;padding:18px;border-radius:20px;background:#fff;box-shadow:0 9px 23px #0019233b}.summary h2{margin:0 0 4px;font-size:21px}.summary p{margin:0 0 13px;color:var(--muted);font-size:12px}.summary div{display:flex;justify-content:space-between;gap:12px;margin:9px 0;font-size:13px}.summary b{text-align:right}.secondary{width:100%;margin-top:9px;padding:11px;border:1px solid #8dc9dc;border-radius:11px;background:#fff;color:#086d91;font-weight:800}.success{display:none;margin-top:17px;padding:18px;border-radius:20px;background:#effcf5;color:var(--green);box-shadow:0 9px 23px #0019233b}.success h2{margin:0 0 6px;font-size:21px}.success p{margin:0;font-size:13px;line-height:1.45}.success small{display:block;margin-top:12px;font-weight:850;letter-spacing:.4px}
  </style>
</head>
<body>
  <main class="app"><header class="head"><div class="top"><button class="back" type="button" aria-label="Back to Yami">‹</button><div class="brand">Yami</div></div><h1>Water & municipal bills</h1><p>Pay a water account or municipal statement from your Yami balance.</p></header><main class="body"><section class="wallet"><span><small>AVAILABLE YAMI BALANCE</small><b id="wallet"></b></span><span class="drop"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c-4 6-9 10.5-9 17a9 9 0 0 0 18 0c0-6.5-5-11-9-17Z"></path><path d="M11 21c.7 2.4 2.3 3.7 5 4"></path></svg></span></section><section class="card" id="formCard"><label>SERVICE</label><select id="service"><option>Municipal water account</option><option>Prepaid water meter</option><option>Municipal rates & taxes</option></select><label>ACCOUNT OR METER NUMBER</label><input id="account" value="JHB-WTR-204810"><label>AMOUNT</label><input id="amount" inputmode="decimal" value="150"><div class="amounts"><button class="amount selected" type="button" data-amount="150">R150</button><button class="amount" type="button" data-amount="300">R300</button><button class="amount" type="button" data-amount="500">R500</button></div><button class="primary" id="continue" type="button">Continue</button></section><section class="summary" id="summary"><h2>Confirm municipal payment</h2><p>The payment will reflect against the selected account.</p><div><span>Service</span><b id="confirmService"></b></div><div><span>Account</span><b id="confirmAccount"></b></div><div><span>Amount</span><b id="confirmAmount"></b></div><div><span>Payment source</span><b>Yami main balance</b></div><button class="primary" id="confirm" type="button">Confirm and pay</button><button class="secondary" id="edit" type="button">Edit details</button></section><section class="success" id="success"><h2>Payment successful ✓</h2><p id="successText"></p><small id="reference"></small><button class="primary" id="done" type="button">Done</button></section></main></main>
  <script src="/yami-wallet.js?v=1"></script><script>
    const service=document.getElementById('service'),account=document.getElementById('account'),amount=document.getElementById('amount'),formCard=document.getElementById('formCard'),summary=document.getElementById('summary'),success=document.getElementById('success'),wallet=document.getElementById('wallet');
    const renderWallet=()=>wallet.textContent=YamiWallet.format(YamiWallet.get());renderWallet();
    const back=()=>{if(parent!==window)parent.postMessage({type:'yami:closeMiniApp'},'*');else location.assign('/tabs/home/home/');};document.querySelector('.back').onclick=back;document.getElementById('done').onclick=back;
    document.querySelectorAll('.amount').forEach(button=>button.onclick=()=>{amount.value=button.dataset.amount;document.querySelectorAll('.amount').forEach(item=>item.classList.toggle('selected',item===button));});
    document.getElementById('continue').onclick=()=>{const payment=Number(amount.value);if(!account.value.trim())account.value='JHB-WTR-204810';if(!Number.isFinite(payment)||payment<10)amount.value='150';document.getElementById('confirmService').textContent=service.value;document.getElementById('confirmAccount').textContent=account.value;document.getElementById('confirmAmount').textContent=YamiWallet.format(Number(amount.value));formCard.style.display='none';summary.style.display='block';};
    document.getElementById('edit').onclick=()=>{summary.style.display='none';formCard.style.display='block';};
    document.getElementById('confirm').onclick=()=>{const payment=Number(amount.value);const result=YamiWallet.debit(payment,{label:service.value,category:'Services',detail:account.value});if(!result.ok){document.getElementById('confirm').textContent='Insufficient Yami balance';return;}renderWallet();summary.style.display='none';success.style.display='block';document.getElementById('successText').textContent=`${YamiWallet.format(payment)} was paid to ${service.value} for ${account.value}.`;document.getElementById('reference').textContent=result.transaction.id;};
  </script>
</body>
</html>
