<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DStv | Yami</title><style>:root{--blue:#0b4a96;--deep:#082e62;--gold:#f6bf20;--line:#e3e8ee}*{box-sizing:border-box}body{margin:0;background:#122331;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;color:#172b3a}button,input{font:inherit}.app{max-width:414px;min-height:100vh;margin:auto;padding-bottom:30px;background:#f7f9fc;box-shadow:0 0 30px #0008}.head{padding:18px 20px 80px;background:linear-gradient(135deg,var(--deep),var(--blue));color:#fff}.top{display:flex;align-items:center}.back{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#ffffff1c;color:#fff;text-decoration:none;font-size:27px}.brand{margin-left:11px;font-size:26px;font-weight:850}.brand b{color:var(--gold)}.head h1{margin:28px 0 4px;font-size:25px}.head p{margin:0;color:#cfe5ff;font-size:13px}.body{padding:0 16px}.account{margin-top:-56px;padding:17px;border-radius:18px;background:#fff;box-shadow:0 8px 20px #00234f18}.account label{display:block;margin-bottom:7px;color:#687982;font-size:11px;font-weight:800}.account input{width:100%;padding:13px;border:1px solid #dce4e9;border-radius:10px}.primary{width:100%;margin-top:13px;padding:14px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-weight:800}.title{margin:23px 0 11px;font-size:19px}.package{margin-bottom:11px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}.package.selected{border-color:var(--blue);box-shadow:0 4px 14px #0b4a9618}.row{display:flex;justify-content:space-between;gap:12px}.package h3{margin:0;font-size:17px}.package p{margin:6px 0;color:#71808a;font-size:12px}.price{color:var(--blue);font-weight:850;font-size:18px}.select{margin-top:11px;padding:8px 12px;border:1px solid #94bee7;border-radius:9px;background:#fff;color:var(--blue);font-weight:800}.status{margin-top:20px;padding:15px;border-radius:13px;background:#eaf5ff;color:#285374;font-size:13px;line-height:1.45}.modal{position:fixed;z-index:4;inset:0;display:none;align-items:end;background:#001c3c83}.modal.open{display:flex}.sheet{width:100%;padding:14px 20px calc(27px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:#fff}.handle{width:34px;height:4px;margin:0 auto 17px;border-radius:3px;background:#d9e0e4}.sheet h2{margin:0}.summary{margin-top:14px;padding:12px;border-radius:11px;background:#f2f6fa;font-size:13px}.summary div{display:flex;justify-content:space-between;margin:7px}.cancel{width:100%;margin-top:9px;padding:10px;border:0;background:none;color:#66757e;font-weight:700}.success{display:none;margin-top:18px;padding:17px;border-radius:15px;background:#e8f7ed;color:#1e7646;font-size:14px}.success b{display:block;margin-bottom:5px;font-size:17px}.toast{position:fixed;z-index:8;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;padding:11px 15px;border-radius:20px;background:#172b36;color:#fff;font-size:13px;white-space:nowrap;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><main class="app"><header class="head"><div class="top"><a class="back" href="/tabs/home/home/">‹</a><div class="brand">DStv<b>·</b></div></div><h1>Manage your entertainment</h1><p>Renew a package or pay a decoder account from Yami.</p></header><main class="body"><section class="account"><label>DSTV SMARTCARD OR ACCOUNT NUMBER</label><input id="account" value="1134 5678 9012"><button class="primary" id="load">Load account</button></section><h2 class="title">Choose a package</h2><div id="packages"></div><section class="status" id="status"><b>Account ready</b><br>Choose a package to renew your subscription or make a one-time payment.</section><section class="success" id="success"><b>Payment successful ✓</b><span id="successText"></span></section></main></main><div class="modal" id="modal"><section class="sheet"><div class="handle"></div><h2>Confirm DStv payment</h2><p style="color:#71808a;font-size:13px">This demo will charge your Yami main balance.</p><div class="summary" id="summary"></div><button class="primary" id="pay">Confirm and pay</button><button class="cancel" id="cancel">Cancel</button></section></div><div class="toast" id="toast"></div><script>const plans=[['DStv Access','Essential entertainment for your household',129],['DStv Family','More sport, movies and kids channels',329],['DStv Compact','Live sport, local stories and movies',599]];let selected;const toast=(x)=>{toastEl.textContent=x;toastEl.classList.add('show');clearTimeout(window.dt);window.dt=setTimeout(()=>toastEl.classList.remove('show'),2000)};const toastEl=document.getElementById('toast');document.querySelector('.back').onclick=e=>{e.preventDefault();if(parent!==window)parent.postMessage({type:'yami:closeMiniApp'},'*');else location.assign('/tabs/home/home/')};function render(){packages.innerHTML=plans.map((p,i)=>`<article class="package ${selected===i?'selected':''}"><div class="row"><div><h3>${p[0]}</h3><p>${p[1]}</p></div><div class="price">R${p[2]}<small style="display:block;font-size:10px;font-weight:500">per month</small></div></div><button class="select" onclick="choosePlan(${i})">${selected===i?'Selected':'Choose package'}</button></article>`).join('')}function choosePlan(i){selected=i;render();const p=plans[i];summary.innerHTML=`<div><span>Account</span><b>${account.value}</b></div><div><span>Package</span><b>${p[0]}</b></div><div><span>Charge from Yami balance</span><b>R${p[2]}.00</b></div>`;modal.classList.add('open')}load.onclick=()=>toast('DStv account loaded');cancel.onclick=()=>modal.classList.remove('open');pay.onclick=()=>{modal.classList.remove('open');const p=plans[selected];success.style.display='block';successText.textContent=`${p[0]} has been renewed for account ${account.value}.`;toast('DStv renewal paid from Yami balance')};render();</script></body></html>
