function vendorV2(){return `<div class="page vendor-page"><header class="vendor-header"><button class="back" data-tab="home">←</button><h1>Vendor Dashboard</h1><button class="icon-button">▤</button></header><section class="vendor-hero"><p>▣ &nbsp; EKURHULENI METROBUS COMMERCE <span>● Active Vendor</span></p><small>REGISTERED MERCHANT</small><h2>Thabo Khumalo</h2><b>MERCHANT ID &nbsp; ${TAG_DEFAULT}</b><hr><footer>ϟ &nbsp; Settling to Linked PayShap Account <em>INSTANT</em></footer></section><section class="analytics"><header><p>PERFORMANCE ANALYTICS</p><b>▣ Today &amp; Week</b></header><div><article><small>TOTAL EARNED</small><strong>R3,120.00</strong><span>Lifetime</span></article><article><small>THIS WEEK</small><strong>R418.00</strong><span class="in">↗ +19%</span></article><article><small>PAYMENTS</small><strong>74</strong><span>Tap count</span></article></div></section><section class="vendor-routes"><header><p>ROUTES WORKED</p><b>3 Active Hubs</b></header>${['E12|Boksburg Civic Centre|21 sales|R1,680.00','E4|Kempton Park CBD|11 sales|R810.00','E5|OR Tambo Airport|7 sales|R630.00'].map(x=>{const [n,a,b,c]=x.split('|');return `<article><b>${n}</b><span><strong>${a}</strong><small>Primary corridor</small></span><em>${b}<small>${c}</small></em></article>`}).join('')}</section><section class="payments"><p>RECENT PAYMENTS RECEIVED <em>● Live Updates</em></p>${['Sipho M.|+R18.00','Nokwanda D.|+R22.00','Bongani Z.|+R28.00','Zanele K.|+R15.00'].map(x=>{const [n,a]=x.split('|');return `<article><i>${n.split(' ').map(v=>v[0]).join('')}</i><span><b>${n}</b><small>Commuter Snack • Route E12<br>12 min ago</small></span><em>${a} &nbsp; ●</em></article>`}).join('')}</section></div>${nav()}`}
function profileV2(){return `<div class="page profile-page"><header class="profile-header"><h1>Profile</h1><button class="icon-button">⚙</button></header><section class="profile-person"><i>TK</i><span><strong>Thabo Khumalo</strong><small>${TAG_DEFAULT} &nbsp; <b>•</b> Gold Tier</small></span><button>⌕</button></section><section class="account-hero"><p>▣ &nbsp; VENDOR ACCOUNT <span>● Active</span></p><small>SALES EARNINGS</small><h2>This Week: <b>R418.00</b></h2><hr><footer>ϟ &nbsp; Instant PayShap Settlement <em>Dashboard →</em></footer></section><section class="account-menu"><p>ACCOUNT MANAGEMENT</p>${[['◉','My Tags','NFC Commuter Cards &amp; Wristbands','2 Linked'],['▰','Linked Payment Methods','Cards, Ozow &amp; PayShap Bank','›'],['♧','Notification Preferences','Bus delays &amp; balance receipts','›'],['♙','Security &amp; PIN','Biometrics &amp; 6-digit Wallet PIN','›'],['?','Help &amp; Support','24/7 Ekurhuleni MetroBus Hotline','›'],['⇥','Log Out','${TAG_DEFAULT} session','›']].map(r=>`<button><i>${r[0]}</i><span><strong>${r[1]}</strong><small>${r[2]}</small></span><b>${r[3]}</b></button>`).join('')}</section></div>${nav()}`}
function wallet(){return `<div class="page"><header class="top"><div class="brand">Ekurhuleni<span>Bus</span></div><div class="toolset"><button class="icon-button" aria-label="Scan tag">⌗</button><button class="icon-button" aria-label="Notifications">◌</button></div></header><h1>Wallet</h1><p class="sub">Manage your Ekurhuleni MetroBus travel money.</p><section class="balance"><div class="balance-top"><p class="eyebrow" style="color:#c9d2e6">AVAILABLE BALANCE</p><span class="badge">⌁ TAP-READY</span></div><div class="amount">${money(state.balance)}</div><p class="tagline">MetroBus Tag ${TAG_DEFAULT} · PayShap enabled</p><div class="actions"><button class="primary" data-action="topup">+ Top Up</button><button class="secondary" data-action="vendor">Pay Vendor</button></div></section><section class="section"><div class="section-title"><h2>Linked payment methods</h2><button class="link" data-action="add">+ Add</button></div><div class="method-row"><article class="method"><div class="card-icon">${paymentIcon('card')}</div><strong>Standard Bank Gold <mark>DEFAULT</mark></strong><small>•••• 4821 · Exp 09/27</small></article><article class="method"><div class="card-icon">${paymentIcon('eft')}</div><strong>Standard Bank EFT</strong><small><b class="payshap-dot">●</b> Verified PayShap</small></article></div></section><section class="section"><div class="section-title"><h2>Wallet activity</h2><button class="link" data-action="history">View all →</button></div>${activity}</section></div>${nav()}`}
function home(){return `<div class="page"><header class="top"><div class="brand">Ekurhuleni<span>Bus</span></div><button class="icon-button">◌</button></header><div class="greeting"><p class="eyebrow">GOOD AFTERNOON</p><h1>Where are you going?</h1><p class="sub">Ekurhuleni's smart transit wallet.</p></div><section class="balance"><div class="balance-top"><p class="eyebrow" style="color:#c9d2e6">EKURHULENI METROBUS WALLET</p><span class="badge">TAP-READY</span></div><div class="amount">${money(state.balance)}</div><p class="tagline">Tag ${TAG_DEFAULT}</p><button class="primary wide" data-action="topup">+ Add money</button></section><section class="section"><div class="quick"><button data-action="trip"><b>◉</b>Buy a trip</button><button data-action="vendor"><b>⌁</b>Pay vendor</button><button data-action="tag"><b>⌗</b>My tag</button></div></section><section class="notice"><b>◷</b><span><strong>Germiston Station update</strong><br>Route E12 departs from Bay 3 today. Platform B12 under maintenance.</span></section><section class="section"><div class="section-title"><h2>Next departures</h2><button class="link" data-tab="routes">See routes</button></div><div class="route"><span class="route-number">E12</span><div><strong>Germiston → Boksburg Civic</strong><p>Bay 3 · 6 min</p></div><span class="status">On time</span></div></section></div>${nav()}`}
function modal(){if(!state.modal)return '';const isVendor=state.modal==='vendor';return `<div class="modal-wrap"><div class="modal"><button class="close" data-action="close">×</button><div class="handle"></div><h1>${isVendor?'Pay a vendor':'Top up wallet'}</h1><p class="sub">${isVendor?'Send a secure PayShap payment to a registered MetroBus vendor.':'Add money instantly from your linked Standard Bank account.'}</p><input id="amount" class="field" type="number" min="1" placeholder="Amount in rand" ${isVendor?'value="20"':'value="100"'} /><button class="option"><span><strong>${isVendor?'Thabo Khumalo':'Standard Bank Cheque'}</strong><small>${isVendor?'Boksburg Civic · MetroBus Vendor':'•••• 9012 · PayShap Instant EFT'}</small></span><span>›</span></button><button class="primary wide" data-action="confirm">${isVendor?'Pay now':'Top up now'}</button></div></div>`}
function render(){
  if(state.screen==='login') app.innerHTML=login();
  else if(state.screen==='onboarding') app.innerHTML=onboarding();
  else if(['topup','banks','card','processing','success','trip','live-status','airtime','receipt','vendor-pay','tag'].includes(state.screen))
    app.innerHTML=({topup:topUp,banks,card:cardDetails,processing,success:topUpSuccess,trip:buyTrip,'live-status':liveStatus,airtime,receipt:transactionHistory,'vendor-pay':vendorPay,tag:myTag}[state.screen])();
  else app.innerHTML=({wallet,home:homeV2,routes:routesV2,vendor:vendorV2,profile:profileV2}[state.tab]()+modal());
}
app.addEventListener('submit',e=>{if(e.target.matches('.login-card')){e.preventDefault();state.screen='onboarding';render();}});
app.addEventListener('submit',e=>{if(e.target.matches('.card-form')){e.preventDefault();state.screen='processing';render();setTimeout(()=>{state.balance+=state.topUpAmount;state.screen='success';render();},1400);}});
app.addEventListener('click',e=>{const el=e.target.closest('[data-tab],[data-action],[data-amount]');if(!el)return;if(el.dataset.amount){state.topUpAmount=Number(el.dataset.amount);render();return;}if(el.dataset.tab){state.tab=el.dataset.tab;state.modal=null;}const a=el.dataset.action;if(a==='onboard')state.screen='onboarding';if(a==='login')state.screen='login';if(a==='finish'){state.screen='app';state.tab='home';}if(a==='topup'){state.screen='topup';state.modal=null;}if(a==='card'||a==='bank'){const entered=Number(document.querySelector('#topup-amount')?.value);if(entered>0)state.topUpAmount=entered;state.screen=a==='card'?'card':'banks';}if(a==='app'){state.screen='app';state.tab='home';}if(a==='process'){state.screen='processing';render();setTimeout(()=>{state.balance+=state.topUpAmount;state.screen='success';render();},1400);return;}if(a==='vendor'||a==='history')state.modal=a;if(a==='add')alert('Add a payment method flow is ready to connect to your bank provider.');if(a==='trip')state.screen='trip';if(a==='live-status')state.screen='live-status';if(a==='pay-trip'){if(state.balance>=14){state.balance-=14;state.screen='app';state.tab='home';}else alert('Your wallet balance is too low.');}if(a==='confirm'){const v=Number(document.querySelector('#amount').value)||0;if(v>0){state.balance+=state.modal==='vendor'?-v:v;state.modal='success';}}if(a==='close')state.modal=null;render();});
app.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='airtime'){serviceMode='airtime';state.screen='airtime';render();}if(action==='receipt'){state.screen='receipt';render();}if(action==='vendor'){state.screen='vendor-pay';state.modal=null;render();}if(action==='tag'){state.screen='tag';render();}if(action==='toggle-tag'){phoneTagEnabled=!phoneTagEnabled;render();}if(action==='replace-tag'){alert('A replacement tag request has been started.');}if(action==='unlink-tag'&&confirm(`Unlink MetroBus Tag ${TAG_DEFAULT}?`)){phoneTagEnabled=false;state.screen='app';state.tab='home';render();}if(action==='voucher'){const code=prompt('Enter your MetroBus Voucher Code');if(code){state.balance+=state.topUpAmount;state.screen='success';render();}}if(action==='send-vendor'){if(state.balance>=20){state.balance-=20;state.screen='success';render();}else alert('Your wallet balance is too low.');}if(action==='service-airtime'){serviceMode='airtime';render();}if(action==='service-data'){serviceMode='data';render();}if(action==='service-vouchers'){alert('Voucher purchases are coming next.');}if(action==='buy-airtime'||action==='buy-data'){const cost=action==='buy-data'?85:20;if(state.balance>=cost){state.balance-=cost;state.screen='app';state.tab='home';render();}else alert('Your wallet balance is too low.');}});
app.addEventListener('click',e=>{if(e.target.closest('[data-action="tag"]')){e.stopImmediatePropagation();state.screen='tag';render();}},true);
app.addEventListener('input',e=>{if(e.target.id==='route-search'){routeQuery=e.target.value;render();const field=document.querySelector('#route-search');if(field){field.focus();field.setSelectionRange(routeQuery.length,routeQuery.length);}}});
app.addEventListener('click',e=>{const amountButton=e.target.closest('[data-vendor-amount]');if(amountButton){document.querySelectorAll('[data-vendor-amount]').forEach(b=>b.classList.remove('selected'));amountButton.classList.add('selected');const amount=document.querySelector('.vendor-amount>div strong');if(amount)amount.textContent=`${Number(amountButton.dataset.vendorAmount).toFixed(2)}`;const pay=document.querySelector('[data-action="send-vendor"]');if(pay)pay.textContent=`Send Payment — R${Number(amountButton.dataset.vendorAmount).toFixed(2)} →`;}});
app.addEventListener('click',e=>{const button=e.target.closest('button');if(!button||button.dataset.action||button.dataset.tab||button.dataset.amount)return;const label=button.textContent.trim();if(button.closest('.route-filter')){const filterMap={'Germiston':'germiston','Boksburg':'boksburg','Kempton Park':'kempton'};const key=filterMap[label];routeQuery=key?label.split(' ')[0]:'';render();return;}if(button.closest('.history-filter')||button.closest('.fare-tabs')||button.closest('.bundle-tabs')||button.closest('.recipient-toggle')||button.closest('.provider-row')){button.parentElement.querySelectorAll('button,.provider-row b').forEach(x=>x.classList.remove('active','selected'));button.classList.add('active','selected');return;}if(label.includes('FORGOT PASSWORD')){alert('A password reset link will be sent to your registered mobile number.');return;}if(label.includes('See map')){state.tab='routes';render();return;}if(label.includes('My Tags')){alert(`Your Ekurhuleni MetroBus Tag ${TAG_DEFAULT} is linked and tap-ready.`);return;}if(label.includes('Payment methods')){state.tab='wallet';render();return;}if(label.includes('Trip history')){state.screen='receipt';render();return;}if(label.includes('Help')||label.includes('Support')){alert(`${BRAND} support: ${SUPPORT_NUMBER}.`);return;}if(label.includes('Log Out')){state.screen='login';render();return;}if(['✓','⌛','⊗'].includes(label[0])){alert('Thanks - your route status report has been submitted.');}});
render();
})();
</script>
</body>
</html>
