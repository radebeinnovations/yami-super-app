<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17394d">
    <title>Yami Airtime & Data</title>
    <style>
      :root{--navy:#17394d;--orange:#ff671d;--ink:#1d3748;--muted:#6d8390;--line:#dce7eb;--soft:#f3f8fa;--green:#16825b}*{box-sizing:border-box}body{min-width:320px;margin:0;background:#edf3f5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{width:min(100%,560px);min-height:100vh;margin:auto;padding:18px 18px calc(32px + env(safe-area-inset-bottom));background:#fff}.top{display:grid;grid-template-columns:42px 1fr 42px;align-items:center}.back{display:grid;width:40px;height:40px;place-items:center;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--navy);font-size:25px}.top h1{margin:0;color:var(--navy);font-size:19px;letter-spacing:-.4px;text-align:center}.top span{width:40px}.hero{position:relative;overflow:hidden;margin:24px 0 20px;padding:20px;border-radius:23px;background:linear-gradient(135deg,#17394d,#2d708f);color:#fff;box-shadow:0 13px 26px #17394d25}.hero:after{position:absolute;right:-36px;bottom:-69px;width:190px;height:190px;border:1px solid #ffffff2d;border-radius:50%;content:""}.hero p,.hero h2{position:relative;z-index:1}.hero p{margin:0;color:#d5eaf2;font-size:11px;font-weight:800;letter-spacing:1px}.hero h2{max-width:270px;margin:8px 0 3px;font-size:27px;line-height:1.02;letter-spacing:-.8px}.hero small{position:relative;z-index:1;color:#dceef5;font-size:12px}.card{padding:17px;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:0 7px 17px #17394d0b}.label{display:block;margin:0 0 7px;color:#5e7482;font-size:10px;font-weight:850;letter-spacing:.7px}.phone{display:flex;align-items:center;gap:9px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fbfdfe}.phone span{color:var(--orange);font-weight:850}.phone input{width:100%;padding:14px 0;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px}.tabs{display:grid;grid-template-columns:1fr 1fr;margin:17px 0 13px;padding:4px;border-radius:13px;background:#edf4f7}.tabs button{padding:10px;border:0;border-radius:10px;background:transparent;color:#65808d;font-size:13px;font-weight:800}.tabs button.active{background:#fff;color:var(--navy);box-shadow:0 3px 9px #18394d1a}.providers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.provider{min-height:56px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#526f7e;font-size:10px;font-weight:850}.provider.active{border-color:var(--orange);background:#fff3ec;color:#c65215}.provider b{display:block;font-size:13px}.provider small{font-size:9px}.section{margin-top:23px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.section h2{margin:0;color:var(--navy);font-size:18px}.section span{color:var(--muted);font-size:11px;font-weight:700}.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.amount{padding:13px 7px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--navy);font-size:14px;font-weight:850}.amount.active{border-color:var(--orange);background:#fff0e8;color:#cc5316}.summary{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding:15px 16px;border-radius:16px;background:var(--soft)}.summary small{display:block;color:var(--muted);font-size:10px;font-weight:750}.summary b{display:block;margin-top:4px;color:var(--navy);font-size:16px}.summary strong{color:var(--orange);font-size:20px}.pay{width:100%;margin-top:13px;padding:15px;border:0;border-radius:13px;background:var(--orange);box-shadow:0 8px 16px #ff671d35;color:#fff;font-size:15px;font-weight:850}.notice{margin-top:18px;padding:13px;border-radius:14px;background:#eff8f4;color:#376d58;font-size:11px;line-height:1.45}.notice b{color:#176847}.success{display:none;margin-top:16px;padding:16px;border:1px solid #b8e5d0;border-radius:16px;background:#f1fbf5;color:#236a4d;font-size:13px;line-height:1.45}.success.show{display:block}.success b{display:block;margin-bottom:3px;color:#126842}@media(max-width:370px){.app{padding-right:13px;padding-left:13px}.providers{gap:5px}.provider{font-size:9px}.hero h2{font-size:25px}}
    </style>
  </head>
  <body>
    <main class="app">
      <header class="top"><button class="back" type="button" id="back" aria-label="Back">‹</button><h1>Airtime &amp; Data</h1><span></span></header>
      <section class="hero"><p>STAY CONNECTED</p><h2>Recharge your way.</h2><small>Buy airtime or data for any South African mobile number.</small></section>
      <section class="card"><label class="label" for="phone">MOBILE NUMBER</label><div class="phone"><span>+27</span><input id="phone" type="tel" inputmode="numeric" placeholder="71 234 5678" aria-label="Mobile number"></div><div class="tabs" role="tablist"><button class="active" type="button" data-kind="Airtime">Airtime</button><button type="button" data-kind="Data">Data</button></div><div class="providers" aria-label="Mobile network"><button class="provider active" type="button" data-provider="Vodacom"><b>Vodacom</b><small>Prepaid</small></button><button class="provider" type="button" data-provider="MTN"><b>MTN</b><small>Prepaid</small></button><button class="provider" type="button" data-provider="Telkom"><b>Telkom</b><small>Mobile</small></button><button class="provider" type="button" data-provider="Cell C"><b>Cell C</b><small>Prepaid</small></button></div></section>
      <section class="section"><div class="section-head"><h2 id="amount-title">Choose airtime</h2><span id="bundle-note">Instant recharge</span></div><div class="amounts" id="amounts"></div></section>
      <section class="summary"><span><small id="summary-kind">Airtime · Vodacom</small><b id="summary-number">Add a mobile number</b></span><strong id="summary-price">R20</strong></section><button class="pay" type="button" id="pay">Buy airtime</button>
      <p class="notice"><b>Demo environment.</b> Purchases are simulated locally. Your real balance will not be charged.</p><section class="success" id="success"><b id="success-title">Airtime sent</b><span id="success-copy"></span></section>
    </main>
    <script>
      const requestedKind=new URLSearchParams(location.search).get('kind')==='data'?'Data':'Airtime';
      const appState={kind:requestedKind,provider:'Vodacom',amount:requestedKind==='Data'?'500 MB':'R20'};
      const bundles={Airtime:['R10','R20','R50','R100','R200','R500'],Data:['250 MB','500 MB','1 GB','2 GB','5 GB','10 GB']};
      const dataPrices={'250 MB':'R19','500 MB':'R29','1 GB':'R49','2 GB':'R89','5 GB':'R179','10 GB':'R299'};
      const amountEl=document.querySelector('#amounts');const amountTitle=document.querySelector('#amount-title');const summaryKind=document.querySelector('#summary-kind');const summaryNumber=document.querySelector('#summary-number');const summaryPrice=document.querySelector('#summary-price');const pay=document.querySelector('#pay');const phone=document.querySelector('#phone');
      function price(){return appState.kind==='Data'?(dataPrices[appState.amount]||'R49'):appState.amount}function refresh(){document.title=`Yami ${appState.kind}`;document.querySelector('.top h1').textContent=appState.kind;document.querySelectorAll('[data-kind]').forEach(item=>item.classList.toggle('active',item.dataset.kind===appState.kind));amountTitle.textContent=`Choose ${appState.kind.toLowerCase()}`;amountEl.innerHTML=bundles[appState.kind].map(item=>`<button type="button" class="amount ${item===appState.amount?'active':''}" data-amount="${item}">${item}</button>`).join('');summaryKind.textContent=`${appState.kind} · ${appState.provider}`;summaryNumber.textContent=phone.value.trim()?`+27 ${phone.value.trim()}`:'Add a mobile number';summaryPrice.textContent=price();pay.textContent=`Buy ${appState.kind.toLowerCase()}`}
      document.querySelectorAll('[data-kind]').forEach(button=>button.addEventListener('click',()=>{appState.kind=button.dataset.kind;appState.amount=bundles[appState.kind][1];document.querySelectorAll('[data-kind]').forEach(item=>item.classList.toggle('active',item===button));refresh()}));document.querySelectorAll('[data-provider]').forEach(button=>button.addEventListener('click',()=>{appState.provider=button.dataset.provider;document.querySelectorAll('[data-provider]').forEach(item=>item.classList.toggle('active',item===button));refresh()}));amountEl.addEventListener('click',event=>{const button=event.target.closest('[data-amount]');if(!button)return;appState.amount=button.dataset.amount;refresh()});phone.addEventListener('input',refresh);pay.addEventListener('click',()=>{const number=phone.value.replace(/\D/g,'');if(number.length<9){phone.focus();phone.setAttribute('aria-invalid','true');return}phone.removeAttribute('aria-invalid');document.querySelector('#success-title').textContent=`${appState.kind} sent`;document.querySelector('#success-copy').textContent=`${appState.amount} from ${appState.provider} has been sent to +27 ${number}. Demo confirmation only.`;document.querySelector('#success').classList.add('show')});document.querySelector('#back').addEventListener('click',()=>{if(parent!==window)parent.postMessage({type:'yami:closeMiniApp'},'*');else history.back()});refresh();
    </script>
  </body>
</html>
