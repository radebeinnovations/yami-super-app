<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Yami Flights</title><style>:root{--navy:#092c4b;--sky:#178dcc;--orange:#ff7a18;--ink:#172a3a;--line:#e4eaee}*{box-sizing:border-box}body{margin:0;background:#152431;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;color:var(--ink)}button,input,select{font:inherit}.app{min-height:100vh;max-width:414px;margin:auto;padding-bottom:24px;background:#f7fafc;box-shadow:0 0 30px #0008}.head{padding:18px 19px 70px;color:#fff;background:linear-gradient(135deg,var(--navy),#0b5785)}.top{display:flex;align-items:center}.back{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:#ffffff1f;color:#fff;font-size:27px;text-decoration:none}.brand{margin-left:11px;font-size:22px;font-weight:850}.brand span{color:#81d5ff}.head h1{margin:29px 0 5px;font-size:26px}.head p{margin:0;color:#d8effd;font-size:13px}.body{padding:0 16px 75px}.search{margin-top:-51px;padding:17px;border-radius:19px;background:#fff;box-shadow:0 8px 20px #00294517}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;margin-bottom:6px;color:#657681;font-size:11px;font-weight:800}.field select,.field input{width:100%;padding:12px 9px;border:1px solid #dce5e9;border-radius:10px;background:#fafcfd;font-size:13px}.primary{width:100%;margin-top:15px;padding:14px;border:0;border-radius:11px;background:var(--orange);color:#fff;font-weight:800}.title{margin:23px 1px 11px;font-size:19px}.flight{margin-bottom:12px;padding:16px;border:1px solid var(--line);border-radius:17px;background:#fff}.line{display:flex;justify-content:space-between;align-items:start}.time{font-size:20px;font-weight:850}.sub{margin-top:4px;color:#71808a;font-size:12px}.price{color:var(--orange);font-size:19px;font-weight:850;text-align:right}.price small{display:block;color:#788792;font-size:10px;font-weight:500}.flight-foot{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}.tag{color:#147c56;font-size:12px;font-weight:800}.choose{padding:9px 13px;border:1px solid #79c6ec;border-radius:9px;background:#fff;color:#0872ac;font-weight:800}.modal{position:fixed;z-index:4;inset:0;display:none;align-items:end;background:#001b2d88}.modal.open{display:flex}.sheet{width:100%;padding:13px 20px calc(28px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:#fff}.handle{width:34px;height:4px;margin:0 auto 18px;border-radius:4px;background:#d9e0e4}.sheet h2{margin:0}.summary{margin-top:15px;padding:13px;border-radius:11px;background:#f2f8fb;font-size:13px}.summary div{display:flex;justify-content:space-between;margin:7px 0}.cancel{width:100%;margin-top:9px;padding:10px;border:0;background:none;color:#697780;font-weight:700}.ticket{margin-top:16px;padding:17px;border-radius:16px;background:linear-gradient(135deg,#083051,#0b608d);color:#fff}.ticket small{color:#b8e7ff}.ticket h2{margin:7px 0}.hidden{display:none}.toast{position:fixed;z-index:9;left:50%;bottom:30px;transform:translate(-50%,20px);opacity:0;padding:11px 15px;border-radius:20px;background:#172a35;color:#fff;font-size:13px;white-space:nowrap;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><main class="app"><header class="head"><div class="top"><a class="back" href="/tabs/home/home/">‹</a><div class="brand">yami <span>flights</span></div></div><h1>Where do you want to go?</h1><p>Search and reserve your next domestic flight.</p></header><main class="body"><section class="search"><div class="fields"><div class="field"><label>FROM</label><select id="from"><option>Johannesburg (JNB)</option><option>Cape Town (CPT)</option><option>Durban (DUR)</option></select></div><div class="field"><label>TO</label><select id="to"><option>Cape Town (CPT)</option><option>Durban (DUR)</option><option>Johannesburg (JNB)</option></select></div><div class="field"><label>DEPARTURE</label><input id="date" type="date"></div><div class="field"><label>TRAVELLERS</label><select id="travellers"><option>1 traveller</option><option>2 travellers</option><option>3 travellers</option></select></div></div><button class="primary" id="search">Search flights</button></section><h2 class="title" id="resultsTitle">Recommended flights</h2><div id="results"></div><section class="ticket hidden" id="ticket"><small>YAMI FLIGHTS · E-TICKET</small><h2 id="ticketRoute"></h2><p id="ticketInfo"></p><div style="margin-top:15px;padding-top:12px;border-top:1px dashed #ffffff8f"><b id="ref"></b><span style="float:right">Confirmed ✓</span></div></section></main></main><div class="modal" id="modal"><section class="sheet"><div class="handle"></div><h2>Review your flight</h2><p style="color:#73818b;font-size:13px">This is a demo booking. Confirming requests payment from your Yami main balance.</p><div class="summary" id="summary"></div><button class="primary" id="confirm">Confirm and pay</button><button class="cancel" id="cancel">Cancel</button></section></div><div class="toast" id="toast"></div><script>const today=new Date().toISOString().slice(0,10);date.value=today;date.min=today;let pick;const toast=(x)=>{toastEl.textContent=x;toastEl.classList.add('show');clearTimeout(window.ft);window.ft=setTimeout(()=>toastEl.classList.remove('show'),2000)};const toastEl=document.getElementById('toast');document.querySelector('.back').onclick=e=>{e.preventDefault();if(parent!==window)parent.postMessage({type:'yami:closeMiniApp'},'*');else location.assign('/tabs/home/home/')};function draw(){const a=from.value,b=to.value;resultsTitle.textContent=`Flights: ${a} to ${b}`;const base=799+Math.abs(a.length-b.length)*9;results.innerHTML=['06:40','11:25','18:10'].map((time,i)=>`<article class="flight"><div class="line"><div><div class="time">${time} → ${String((Number(time.slice(0,2))+2)%24).padStart(2,'0')}:${i?'45':'20'}</div><div class="sub">Yami Air · Direct · Carry-on included</div></div><div class="price">R${base+i*190}<small>per traveller</small></div></div><div class="flight-foot"><span class="tag">● ${9-i*2} seats left</span><button class="choose" onclick="selectFlight(${base+i*190},'${time}')">Select</button></div></article>`).join('')}function selectFlight(price,time){pick={price,time,from:from.value,to:to.value};summary.innerHTML=`<div><span>Route</span><b>${pick.from} → ${pick.to}</b></div><div><span>Departure</span><b>${date.value} · ${time}</b></div><div><span>Payment from Yami balance</span><b>R${price}</b></div>`;modal.classList.add('open')}search.onclick=draw;cancel.onclick=()=>modal.classList.remove('open');confirm.onclick=()=>{modal.classList.remove('open');ticket.classList.remove('hidden');ticketRoute.textContent=`${pick.from} → ${pick.to}`;ticketInfo.textContent=`${date.value} · ${pick.time} · ${travellers.value}`;ref.textContent=`YF-${Math.random().toString(36).slice(2,8).toUpperCase()}`;toast('Flight booked from your Yami balance')};draw();</script></body></html>
