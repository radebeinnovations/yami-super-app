<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Yami Finances</title>
  <style>
    :root{--ink:#1b3040;--brand:#17394d;--tint:#edf4f7;--success:#1d7b51}*{box-sizing:border-box}body{margin:0;background:#17272f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.app{max-width:414px;min-height:100vh;margin:auto;background:#f7fafb;box-shadow:0 0 30px #0008}.head{padding:18px 20px 76px;background:linear-gradient(135deg,#183e54,#102938);color:#fff}.top{display:flex;align-items:center}.back{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#ffffff20;color:#fff;text-decoration:none;font-size:27px}.brand{margin-left:11px;font-size:22px;font-weight:850}.head h1{margin:29px 0 4px;font-size:26px}.head p{margin:0;color:#d1e4ec;font-size:13px}.body{padding:0 16px 35px}.wallet{display:flex;justify-content:space-between;align-items:center;margin-top:-52px;padding:17px;border-radius:19px;background:#fff;box-shadow:0 8px 19px #00251b18}.wallet small{display:block;color:#74838b;font-size:11px;font-weight:700}.wallet b{font-size:20px}.wallet span{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#edf4f7;font-size:20px}.card{margin-top:17px;padding:17px;border-radius:19px;background:#fff;box-shadow:0 8px 19px #00251b12}.card label{display:block;margin:0 0 7px;color:#6e7e82;font-size:11px;font-weight:800}.card input{width:100%;padding:13px;border:1px solid #d9e5e1;border-radius:10px;background:#fbfdfd}.title{margin:24px 0 11px;font-size:19px}.plan{margin-bottom:10px;padding:15px;border:1px solid #e1eae7;border-radius:15px;background:#fff}.plan.selected{border-color:#17394d;background:#edf4f7}.row{display:flex;justify-content:space-between;gap:12px}.plan b{font-size:16px}.plan p{margin:5px 0;color:#738183;font-size:12px}.pick{margin-top:9px;padding:8px 12px;border:1px solid #91b6c6;border-radius:9px;background:#fff;color:#17394d;font-weight:800}.primary{width:100%;margin-top:15px;padding:14px;border:0;border-radius:11px;background:#17394d;color:#fff;font-weight:800}.receipt{display:none;margin-top:18px;padding:17px;border-radius:15px;background:#e7f6ed;color:#1b7545}.receipt b{display:block;margin-bottom:6px;font-size:17px}.modal{position:fixed;z-index:5;inset:0;display:none;align-items:end;background:#00251d80}.modal.open{display:flex}.sheet{width:100%;padding:14px 20px calc(27px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:#fff}.handle{width:34px;height:4px;margin:0 auto 17px;border-radius:3px;background:#d9e2df}.summary{margin-top:13px;padding:12px;border-radius:11px;background:#f2f7f5;font-size:13px}.summary div{display:flex;justify-content:space-between;gap:12px;margin:7px}.cancel{width:100%;margin-top:9px;padding:10px;border:0;background:none;color:#65747a;font-weight:700}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><div class="top"><a class="back" href="/tabs/home/home/">‹</a><div class="brand">Yami finances</div></div><h1 id="title"></h1><p id="intro"></p></header>
    <main class="body"><section class="wallet"><div><small>YAMI MAIN BALANCE</small><b id="wallet">R10,057.00</b></div><span>Y</span></section><section class="card"><label id="inputLabel"></label><input id="reference"><button class="primary" id="continueButton">Continue</button></section><h2 class="title">Choose an option</h2><div id="plans"></div><section class="receipt" id="receipt"><b id="receiptTitle">Completed successfully ✓</b><span id="receiptText"></span></section></main>
  </main>
  <div class="modal" id="modal"><section class="sheet"><div class="handle"></div><h2 id="modalTitle">Confirm request</h2><p style="color:#71807f;font-size:13px">This is a Yami demo. Review the details before confirming.</p><div class="summary" id="summary"></div><button class="primary" id="confirmButton">Confirm</button><button class="cancel" id="cancelButton">Cancel</button></section></div>
  <script>
    const mode = new URLSearchParams(location.search).get('mode') || 'savings';
    const modes = {
      savings:{title:'Savings goals',intro:'Set aside a little for the things that matter.',label:'GOAL NAME',placeholder:'e.g. December holiday',value:'December holiday',verb:'Savings plan activated',plans:[['Start small','Save R200 each month',200],['Steady saver','Save R500 each month',500],['Goal focused','Save R1,000 each month',1000]]},
      invest:{title:'Invest with Yami',intro:'Explore simple ways to start growing your money.',label:'INVESTMENT GOAL',placeholder:'e.g. Long-term growth',value:'Long-term growth',verb:'Investment instruction created',plans:[['Starter portfolio','Start with R250',250],['Growth portfolio','Start with R500',500],['Balanced portfolio','Start with R1,000',1000]]},
      credit:{title:'Credit options',intro:'See a simple, transparent finance estimate.',label:'PURPOSE OF CREDIT',placeholder:'e.g. Home appliance',value:'Home appliance',verb:'Credit enquiry received',plans:[['Flex credit','Estimated limit up to R1,000',0],['Everyday credit','Estimated limit up to R3,000',0],['Planned purchase','Estimated limit up to R7,500',0]]}
    };
    const config = modes[mode] || modes.savings;
    const titleEl=document.getElementById('title'), introEl=document.getElementById('intro'), inputLabelEl=document.getElementById('inputLabel'), referenceEl=document.getElementById('reference'), plansEl=document.getElementById('plans'), summaryEl=document.getElementById('summary'), modalEl=document.getElementById('modal'), receiptEl=document.getElementById('receipt'), receiptTitleEl=document.getElementById('receiptTitle'), receiptTextEl=document.getElementById('receiptText'), walletEl=document.getElementById('wallet');
    let selected=0, wallet=10057;
    titleEl.textContent=config.title;introEl.textContent=config.intro;inputLabelEl.textContent=config.label;referenceEl.placeholder=config.placeholder;referenceEl.value=config.value;
    document.querySelector('.back').onclick=event=>{event.preventDefault();if(parent!==window)parent.postMessage({type:'yami:closeMiniApp'},'*');else location.assign('/tabs/home/home/');};
    function render(){plansEl.innerHTML=config.plans.map((plan,index)=>`<article class="plan ${selected===index?'selected':''}"><div class="row"><b>${plan[0]}</b><b>${plan[2] ? `R${plan[2]}` : 'Estimate'}</b></div><p>${plan[1]}</p><button class="pick" onclick="selectPlan(${index})">${selected===index?'Selected':'Choose'}</button></article>`).join('');}
    function selectPlan(index){selected=index;render();}
    document.getElementById('continueButton').onclick=()=>{if(!referenceEl.value.trim()){referenceEl.focus();return;}const plan=config.plans[selected];summaryEl.innerHTML=`<div><span>${config.label}</span><b>${referenceEl.value}</b></div><div><span>${plan[0]}</span><b>${plan[1]}</b></div><div><span>Yami main balance</span><b>R${wallet.toLocaleString('en-ZA',{minimumFractionDigits:2})}</b></div>`;document.getElementById('modalTitle').textContent=mode==='credit'?'Confirm enquiry':'Confirm selection';document.getElementById('confirmButton').textContent=mode==='credit'?'Submit enquiry':`Confirm R${plan[2]}.00`;modalEl.classList.add('open');};
    document.getElementById('cancelButton').onclick=()=>modalEl.classList.remove('open');
    document.getElementById('confirmButton').onclick=()=>{const plan=config.plans[selected];modalEl.classList.remove('open');if(plan[2]){wallet-=plan[2];walletEl.textContent=`R${wallet.toLocaleString('en-ZA',{minimumFractionDigits:2})}`;}receiptEl.style.display='block';receiptTitleEl.textContent=`${config.verb} ✓`;receiptTextEl.textContent=mode==='credit'?`Your ${plan[0].toLowerCase()} enquiry for ${referenceEl.value} is ready for review.`:`Your ${plan[0].toLowerCase()} for ${referenceEl.value} is set up.`;};
    render();
  </script>
</body>
</html>
